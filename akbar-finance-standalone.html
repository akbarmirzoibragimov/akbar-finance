<style>
/* Akbar Finance 3.0 — iOS-style dark/light theme */
:root{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --card3:#3A3A3C; --text:#FFFFFF; --text2:#98989D; --sep:rgba(84,84,88,.55);
  --accent:#0A84FF; --income:#30D158; --expense:#FF453A; --planned:#FF9F0A; --savings:#BF5AF2; --teal:#64D2FF;
  --bar:rgba(22,22,24,.72); --overlay:rgba(0,0,0,.55); --shadow:0 10px 40px rgba(0,0,0,.45);
  --r:16px; --r-sm:12px; --tabh:58px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#E5E5EA; --card3:#D1D1D6; --text:#000000; --text2:#6C6C70; --sep:rgba(60,60,67,.22);
  --accent:#007AFF; --income:#248A3D; --expense:#D70015; --planned:#C93400; --savings:#8944AB; --teal:#0071A4;
  --bar:rgba(249,249,249,.78); --overlay:rgba(0,0,0,.3); --shadow:0 10px 40px rgba(0,0,0,.15); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Only the viewport may scroll vertically. Never give html AND body an overflow value: body would become its own
   scroll container and the mouse wheel stops working on desktop (bug t28u). `clip` hides horizontal overflow without
   creating a scroll container. */
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);max-width:100%}
html{overflow-x:hidden;overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
svg{display:block}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:28px;height:28px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--income)}.neg{color:var(--expense)}.plan{color:var(--planned)}.sav{color:var(--savings)}.acc{color:var(--accent)}.muted{color:var(--text2)}
.small{font-size:13px}.tiny{font-size:11px}.b{font-weight:600}.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;width:100%;max-width:100vw;overflow-x:clip}
.main{flex:1;min-width:0;padding:calc(var(--sat) + 8px) calc(16px + var(--sar)) calc(var(--tabh) + var(--sab) + 96px) calc(16px + var(--sal));}
.screen{max-width:760px;margin:0 auto;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:.4;transform:translateX(24px)}to{opacity:1;transform:none}}
.screen.pushed{animation:slideIn .22s ease}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px;position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(var(--sat)) 16px 0;background:transparent}
.topbar.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.topbar .back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:8px 0;min-width:0}
.topbar .spacer{flex:1}
.topbar .tb-title{font-weight:600;font-size:17px;position:absolute;left:50%;transform:translateX(-50%);max-width:55%;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);position:relative;background:transparent}
.iconbtn.filled{background:var(--card)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--expense);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
h1.large{font-size:34px;font-weight:700;letter-spacing:.01em;margin:4px 0 14px}
h2.sec{font-size:22px;font-weight:700;margin:22px 0 10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px;gap:8px}
.sec-h .t{font-size:20px;font-weight:700}
.sec-h a,.sec-h button{color:var(--accent);font-size:15px}

/* ---------- tab bar / sidebar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-start;
  padding:6px calc(8px + var(--sar)) calc(var(--sab) + 4px) calc(8px + var(--sal));height:calc(var(--tabh) + var(--sab));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text2);font-size:10.5px;font-weight:500;padding-top:2px;min-width:0}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--accent)}
.fab{position:fixed;z-index:31;right:calc(18px + var(--sar));bottom:calc(var(--tabh) + var(--sab) + 16px);width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(10,132,255,.45);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab .ic{width:28px;height:28px;stroke-width:2.4}
.sidebar{display:none}
@media (min-width:1000px){
  .tabbar,.fab{display:none}
  .sidebar{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:.5px solid var(--sep);background:var(--card)}
  :root[data-theme=light] .sidebar{background:#F9F9FB}
  .sidebar .brand{font-size:20px;font-weight:800;padding:6px 10px 18px;display:flex;align-items:center;gap:10px}
  .sidebar .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff}
  .side-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text);font-size:15px;font-weight:500;text-align:left;width:100%}
  .side-item:hover{background:var(--card2)}
  .side-item.on{background:var(--accent);color:#fff}
  .side-add{margin-top:10px;background:var(--accent);color:#fff;justify-content:center;font-weight:600}
  .side-sub{font-size:12px;color:var(--text2);padding:16px 12px 4px;text-transform:uppercase;letter-spacing:.04em}
  .main{padding:20px 32px 60px}
  .screen{max-width:1180px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .grid2>.card,.grid2>.list{margin-top:0}
  .grid2 .span2{grid-column:1/-1}
}

/* ---------- cards & lists ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:12px;position:relative;overflow:hidden}
.card.tap{cursor:pointer;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h .t{font-size:17px;font-weight:600}
.card-h .more{color:var(--accent);font-size:14px;display:flex;align-items:center;gap:2px}
.card-f{display:flex;justify-content:center;margin:12px -16px -16px;border-top:.5px solid var(--sep)}
.card-f button{color:var(--accent);padding:12px;font-size:15px;width:100%}
.hero{padding:18px 18px 16px;background:linear-gradient(145deg,#1C1C1E 0%,#16233a 120%)}
:root[data-theme=light] .hero{background:linear-gradient(145deg,#ffffff 0%,#e7f0ff 120%)}
.hero .lbl{color:var(--text2);font-size:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:2px 0 12px;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.kpi .k{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:18px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:11px;color:var(--text2);margin-top:2px}
.list{background:var(--card);border-radius:var(--r);margin-top:12px;overflow:hidden}
.list.inset{margin-top:0;background:transparent;border-radius:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--sep)}
.row.noicon+.row::before,.list.noic .row+.row::before{left:16px}
.row.tap{cursor:pointer}.row.tap:active{background:var(--card2)}
.row .main-t{flex:1;min-width:0}
.row .t1{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .amt{text-align:right;font-weight:600;white-space:nowrap}
.row .amt .t2{font-weight:400}
.row .chev{color:var(--text3,#5a5a5e)}
.cat-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.cat-ic .ic{width:20px;height:20px}
.cat-ic.sq{border-radius:10px}
.group-h{padding:14px 16px 6px;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between}

/* accounts grid — Wallet-like colored tiles */
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
@media (min-width:560px){.acc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.acc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.acc-tile{border-radius:12px;padding:10px 12px;min-height:70px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;transition:transform .12s}
.acc-tile:active{transform:scale(.97)}
.acc-tile .n{font-size:13px;font-weight:600;opacity:.95;display:flex;align-items:center;gap:6px;min-width:0}
.acc-tile .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-tile .v{font-size:16px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.acc-tile .s{font-size:11px;opacity:.85}
.acc-tile.add{background:transparent;border:1.5px dashed var(--card3);color:var(--accent);align-items:center;justify-content:center;flex-direction:row;gap:6px;font-weight:600;font-size:14px}
.acc-tile.dark-text{color:#000}
.acc-tile .shine{position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.12)}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .5s}
.bar.thin{height:5px}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text)}
.ring{position:relative;display:grid;place-items:center}
.ring .in{position:absolute;text-align:center}

/* chips / segmented */
.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.seg button.on{background:var(--card3);box-shadow:0 1px 4px rgba(0,0,0,.25)}
:root[data-theme=light] .seg button.on{background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:16px;background:var(--card2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--text2);white-space:nowrap}
.tag.warn{background:rgba(255,159,10,.18);color:var(--planned)}
.tag.danger{background:rgba(255,69,58,.18);color:var(--expense)}
.tag.ok{background:rgba(48,209,88,.18);color:var(--income)}
.tag.info{background:rgba(10,132,255,.18);color:var(--accent)}
.tag.sav{background:rgba(191,90,242,.18);color:var(--savings)}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--card2);margin-top:8px;font-size:14px}
.alert .ic{margin-top:1px}
.alert.danger{background:rgba(255,69,58,.14)} .alert.danger .ic{color:var(--expense)}
.alert.warn{background:rgba(255,159,10,.14)} .alert.warn .ic{color:var(--planned)}
.alert.ok{background:rgba(48,209,88,.14)} .alert.ok .ic{color:var(--income)}
.alert.info{background:rgba(10,132,255,.14)} .alert.info .ic{color:var(--accent)}
.alert .grow{flex:1;min-width:0}
.alert .act{color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;min-height:46px}
.btn.block{width:100%}
.btn.sec{background:var(--card2);color:var(--accent)}
.btn.danger{background:rgba(255,69,58,.16);color:var(--expense)}
.btn.ok{background:var(--income);color:#000}
.btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns>.btn{flex:1}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--text2);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:.5px solid var(--sep)}
.tbl td{padding:8px 4px;border-bottom:.5px solid var(--sep);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-bottom:0}
.tbl-wrap{overflow-x:auto;max-width:100%}

/* forms */
.form .fld{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:48px;position:relative;background:var(--card)}
.form .fld+.fld::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.form .fld label{flex:none;width:42%;color:var(--text);font-size:15px}
.form .fld .ctl{flex:1;min-width:0;text-align:right}
.form .fld.col{flex-direction:column;align-items:stretch}
.form .fld.col label{width:auto;color:var(--text2);font-size:13px}
.form .group{border-radius:var(--r-sm);overflow:hidden;margin-top:12px}
.form .gh{font-size:13px;color:var(--text2);text-transform:uppercase;margin:16px 16px 6px;letter-spacing:.03em}
.form .note{font-size:12px;color:var(--text2);margin:6px 16px 0}
input.in,select.in,textarea.in{width:100%;background:transparent;border:0;outline:0;text-align:right;font-size:16px;color:var(--text);padding:4px 0;min-width:0}
textarea.in{text-align:left;resize:vertical;min-height:60px}
.fld.col input.in,.fld.col select.in{text-align:left}
select.in{appearance:none;-webkit-appearance:none;direction:rtl;color:var(--accent)}
select.in option{direction:ltr;color:#000}
input.in::placeholder{color:var(--text2)}
input[type=date].in,input[type=time].in,input[type=month].in{text-align:right;color:var(--accent);min-height:24px}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--card3);position:relative;transition:.2s;flex:none;cursor:pointer}
input[type=checkbox].sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
input[type=checkbox].sw:checked{background:var(--income)}
input[type=checkbox].sw:checked::after{left:22px}
.search{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:10px;padding:8px 10px;color:var(--text2)}
.search input{flex:1;background:transparent;border:0;outline:0;font-size:16px;color:var(--text);min-width:0}
.box-in{background:var(--card2);border-radius:10px;padding:10px 12px;border:0;outline:0;width:100%;font-size:16px;color:var(--text)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--overlay);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:14px 14px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow)}
:root[data-theme=light] .sheet{background:#F2F2F7}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px;border-bottom:.5px solid var(--sep);background:var(--card)}
.sheet-h .t{font-weight:600;font-size:17px;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h button{color:var(--accent);font-size:17px;min-width:60px}
.sheet-h button.done{font-weight:600;text-align:right}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(24px + var(--sab));overscroll-behavior:contain}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--card3);margin:6px auto 0}
@media (min-width:1000px){.sheet-wrap{align-items:center}.sheet{border-radius:16px;max-height:88vh}}

/* record form (Wallet-like) */
.rec-top{padding:12px 16px 16px;color:#fff;transition:background .2s}
.rec-top.expense{background:linear-gradient(160deg,#FF453A,#c22d24)}
.rec-top.income{background:linear-gradient(160deg,#30D158,#1f9a3d)}
.rec-top.transfer{background:linear-gradient(160deg,#0A84FF,#0759b3)}
.rec-top.other{background:linear-gradient(160deg,#5E5CE6,#3d3bb0)}
.rec-top .seg{background:rgba(0,0,0,.22)}
.rec-top .seg button{color:#fff}
.rec-top .seg button.on{background:rgba(255,255,255,.28)}
.rec-amount{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;margin-top:18px;min-height:56px}
.rec-amount .sign{font-size:34px;font-weight:300}
.rec-amount .val{font-size:46px;font-weight:300;letter-spacing:-.02em;overflow-wrap:anywhere;text-align:right}
.rec-amount .cur{font-size:18px;opacity:.85}
.rec-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.rec-sel label{display:block;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;font-size:11px;opacity:.95;min-width:0}
.rec-sel select{display:block;width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:15px;font-weight:600;appearance:none;-webkit-appearance:none;padding:2px 0}
.rec-sel select option{color:#000}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);margin:0 -16px}
.keypad button{background:var(--card);height:52px;font-size:24px;font-weight:400}
.keypad button:active{background:var(--card2)}
@media (min-width:1000px){.keypad button{height:44px;font-size:20px}}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--card3);color:var(--text);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--text2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed;border-radius:0;width:14px;vertical-align:3px}
.axis{fill:var(--text2);font-size:10px}
.gridl{stroke:var(--sep);stroke-width:.5}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--text2);padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:10px;padding:4px 2px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card2);min-width:0}
.cal .d.out{opacity:.25}
.cal .d.today{outline:2px solid var(--accent)}
.cal .d.sel{background:var(--accent);color:#fff}
.cal .d.neg{box-shadow:inset 0 -3px 0 var(--expense)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:5px;height:5px;border-radius:50%}

/* misc */
.empty{padding:28px 16px;text-align:center;color:var(--text2);font-size:14px}
.empty .ic{margin:0 auto 8px;width:34px;height:34px;opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 90px);z-index:60;background:var(--card3);color:var(--text);padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:14px;font-size:14px;box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100vw - 32px)}
.toast button{color:var(--accent);font-weight:600}
@media (min-width:1000px){.toast{bottom:28px}}
.onb{max-width:460px;margin:0 auto;padding:calc(var(--sat) + 40px) 20px 40px;text-align:center}
.onb .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 18px;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(10,132,255,.4)}
.onb .logo .ic{width:44px;height:44px}
.onb h1{font-size:30px;margin:0 0 8px}
.onb p{color:var(--text2);margin:0 0 22px}
.onb .btn{margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:15px;border-bottom:.5px solid var(--sep)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text2);min-width:0}
.kv .v{text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.split{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bubble{max-width:88%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.35}
.bubble.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bubble.bot{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.bubble.bot div+div{margin-top:5px}
.verdict{border-radius:14px;padding:16px;font-weight:600;font-size:17px;display:flex;gap:10px;align-items:center}
.verdict.ok{background:rgba(48,209,88,.16);color:var(--income)}
.verdict.risk{background:rgba(255,159,10,.16);color:var(--planned)}
.verdict.violates{background:rgba(255,69,58,.16);color:var(--expense)}
.unconf{color:var(--planned);font-size:11px;font-weight:600}
.dashed-note{border:1px dashed var(--card3);border-radius:12px;padding:10px 12px;color:var(--text2);font-size:13px;margin-top:10px}
/* more / assistant extras */
.profile{display:flex;align-items:center;gap:14px}
.logo-lg{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff;flex:none}
.logo-lg .ic{width:28px;height:28px}
.badge-in{background:var(--expense);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:1px 7px;margin-right:4px}
.ul{margin:0;padding-left:18px}.ul li{margin:6px 0;line-height:1.4}
.row.sub{padding-left:36px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.ask-bar{display:flex;gap:8px;margin-top:12px;align-items:center}
.ask-bar .in{flex:1;min-width:0;background:var(--card);border-radius:20px;padding:10px 14px;border:0;color:var(--text);font-size:16px}
.ask-bar .btn{width:44px;height:44px;padding:0;border-radius:22px;flex:none}
.alert.big{font-size:16px;padding:14px 16px}
.boot-splash{min-height:100vh;display:grid;place-items:center;color:var(--text2);font-weight:600;letter-spacing:.3px}

/* ===== v3 (3.1): dashboard, rings, sections, academy ===== */
.space-seg{margin:2px 0 4px}
.v3top{display:block}
@media (min-width:1000px){.v3top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.v3top>.card,.v3top>.v3sec{margin-top:12px}.v3top>.v3sec>.v3sec-b>.card{margin-top:0}}
.v3ring-row{display:flex;gap:12px;align-items:center;min-width:0}
.v3side{flex:1;min-width:0}
.v3lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text2)}
.v3big{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.2;margin:2px 0 6px;overflow-wrap:anywhere}
.v3rate{display:block;text-align:left;margin-top:8px;font-size:10.5px;line-height:1.45;color:var(--text2);background:var(--card2);border-radius:8px;padding:6px 8px;width:100%}
.ring-c .rc-k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text2)}
.ring-c .rc-v{font-size:15px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.ring-c .rc-u{font-size:10px;color:var(--text2)}
.ring-info{margin-top:10px;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45}
.v3legend{display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
@media (min-width:560px){.v3legend{grid-template-columns:1fr 1fr;column-gap:16px}}
.v3legend .leg{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:12.5px}
.v3legend .leg i{width:10px;height:10px;border-radius:3px}
.v3legend .leg-p{color:var(--text2);min-width:44px;text-align:right}
.v3legend .leg-v{min-width:86px;text-align:right}
.v3boxes{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.v3boxes .box{background:var(--card2);border-radius:12px;padding:10px 12px}
.v3boxes .p{font-size:20px;font-weight:700}
.v3boxes .l{font-size:12px;color:var(--text2);line-height:1.4}
.v3kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:1000px){.v3kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.v3kpis .kpi{background:var(--card);border-radius:14px;padding:12px 14px;min-width:0}
.v3kpis .kpi .v{overflow-wrap:anywhere}
.v3quote{display:flex;gap:10px;align-items:flex-start}
.v3quote .qmark{font-size:34px;line-height:.9;color:var(--accent);font-weight:700}
.v3quote p{margin:0;font-size:14.5px;line-height:1.45}
.v3quote .who{font-size:12px;color:var(--text2);margin-top:6px}
.iconbtn.sm{width:28px;height:28px;flex:none}
.v3sec{margin-top:18px}
.v3sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.v3sec-t{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;color:var(--text);min-width:0;text-align:left}
.v3sec-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3sec-t .ic{transition:transform .2s;color:var(--text2);flex:none}
.v3sec.col .v3sec-t .ic{transform:rotate(-90deg)}

    if (S.modal && S.modal.name === 'record' && App.recordKey && !/INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) App.recordKey(e);
  });

  /* ---------- downloads & files ---------- */
  App.download = function (name, text, mime) {
    var blob = new Blob([text], { type: mime || 'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  };
  App.readFile = function (file) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsText(file); }); };
  App.importFile = function (file) {
    return App.readFile(file).then(function (text) {
      var obj; try { obj = JSON.parse(text); } catch (e) { App.openModal('importPreview', { v: { ok: false, errors: [T('Файл не является корректным JSON', 'File is not valid JSON')], warnings: [] }, fileName: file.name }); return; }
      if (obj && obj.kind === 'akbar-finance-backup' && obj.ledger) obj = obj.ledger;
      var v = C.validateLedger(obj);
      App.openModal('importPreview', { v: v, obj: obj, fileName: file.name });
    });
  };
  App.setLedger = function (L, reason) {
    var prev = S.L;
    var p = prev ? AFDB.addSnapshot('before:' + reason, prev) : Promise.resolve();
    return p.then(function () {
      S.L = L; S.undo = []; S.stack = []; S.tab = 'home';
      App.applyTheme(); return App.save();
    }).then(function () { App.render(); });
  };

  /* ---------- theme ---------- */
  App.applyTheme = function () {
    var th = (S.L && S.L.settings.theme) || App.prefs.theme || 'dark';
    if (th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', th);
    document.documentElement.lang = lang();
    var meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', th === 'light' ? '#F2F2F7' : '#000000');
  };

  /* ---------- shell ---------- */
  var TABS = function () { return [['home', 'home', T('Главная', 'Dashboard')], ['planning', 'plan', T('Планирование', 'Planning')], ['stats', 'stats', T('Статистика', 'Statistics')], ['more', 'grid', T('Ещё', 'More')]]; };
  App.badgeCount = function () { return C.notifications(S.L, S.today).filter(function (n) { return !n.dismissed && n.level !== 'ok' && n.level !== 'info'; }).length; };
  App.render = function (pushed) {
    var root = document.getElementById('app');
    App.applyTheme();
    if (!S.L) { root.innerHTML = '<main class="main" style="padding-bottom:40px">' + App.screens.onboarding() + '</main>'; document.getElementById('tabbar').innerHTML = ''; document.getElementById('fab').classList.add('hidden'); return; }
    var top = S.stack[S.stack.length - 1];
    var name = top ? top.name : S.tab, scr = App.screens[name] || App.screens.home;
    var out;
    try { out = scr(top ? top.p : {}); } catch (e) { console.error(e); out = { title: 'Error', html: '<div class="alert danger">' + esc(e.stack || e) + '</div>' }; }
    var bc = App.badgeCount();
    var bell = '<button class="iconbtn" data-a="go" data-s="notifications" aria-label="notifications">' + I('bell') + (bc ? '<span class="badge">' + bc + '</span>' : '') + '</button>';
    var head = top
      ? '<div class="topbar solid"><button class="back" data-a="back">' + I('back') + '<span>' + T('Назад', 'Back') + '</span></button><div class="tb-title ellipsis">' + esc(out.title || '') + '</div><div class="spacer"></div>' + (out.right || '') + '</div>'
      : '<div class="topbar"><div class="spacer"></div>' + (out.right || '') + bell + '</div><h1 class="large">' + esc(out.title || '') + '</h1>';
    var side = '<nav class="sidebar"><div class="brand"><span class="logo">' + I('wallet') + '</span>Akbar Finance</div>' +
      TABS().map(function (t) { return '<button class="side-item' + (S.tab === t[0] ? ' on' : '') + '" data-a="tab" data-t="' + t[0] + '">' + I(t[1]) + t[2] + '</button>'; }).join('') +
      '<button class="side-item side-add" data-a="modal" data-m="record">' + I('plus') + T('Добавить запись', 'Add record') + '</button>' +
      '<div class="side-sub">' + T('Быстрый доступ', 'Shortcuts') + '</div>' +
      [['notifications', 'bell', T('Уведомления', 'Notifications') + (bc ? ' (' + bc + ')' : '')], ['records', 'log', T('Все записи', 'All records')], ['debts', 'loan', 'Debt Freedom'], ['family', 'family', 'Family Support'], ['purchase', 'scale', T('Проверка покупки', 'Purchase check')], ['assistant', 'chat', T('Помощник', 'Assistant')], ['data', 'download', T('Данные и резервные копии', 'Data & backups')]].map(function (x) { return '<button class="side-item" data-a="go" data-s="' + x[0] + '">' + I(x[1]) + esc(x[2]) + '</button>'; }).join('') +
      '<div style="flex:1"></div><div class="tiny muted" style="padding:8px 12px">' + T('Локальное хранение · без облака', 'Local storage · no cloud') + '</div></nav>';
    root.innerHTML = side + '<main class="main"><div class="screen' + (pushed ? ' pushed' : '') + '">' + head + out.html + '</div></main>';
    document.getElementById('tabbar').innerHTML = TABS().map(function (t) { return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" data-a="tab" data-t="' + t[0] + '">' + I(t[1]) + '<span>' + t[2] + '</span></button>'; }).join('');
    document.getElementById('fab').classList.toggle('hidden', !!top);
    if (out.after) out.after(root);
    if (S.modal) App.renderModal();
  };

  /* ---------- boot ---------- */
  App.boot = function () {
    App.applyTheme();
    AFDB.open().then(function () { return AFDB.get('ledger'); }).then(function (L) {
      if (L) {
        var n = C.normalizeLedger(L); S.L = n.ledger;
        // daily automatic snapshot
        var key = 'snap:' + S.today;
        return AFDB.get('lastSnap').then(function (ls) { if (ls !== key) return AFDB.addSnapshot('auto', S.L).then(function () { return AFDB.set('lastSnap', key); }); });
      }
    }).then(function () {
      S.ready = true; App.render();
      AFDB.persist().then(function (p) { S.persisted = p; });
      // month-end / income reminders are shown in-app (no push notifications)
    }).catch(function (e) { console.error(e); S.ready = true; App.render(); App.toast('Storage error: ' + e); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.AF_STANDALONE) {
      navigator.serviceWorker.register('service-worker.js').catch(function () { });
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !qs('today')) { var t = C.todayISO(); if (t !== S.today) { S.today = t; App.render(); } } });
  };
})();

</script>
<script>
/* Dashboard, accounts, records, notifications, onboarding */
(function () {
  'use strict';
  var App = window.App, C = App.C, I = App.I, CH = App.CH, S = App.S, T = App.T, F = App.F, esc = App.esc;

  /* ---------- shared row renderers ---------- */
  var TX_ICON = { salary: 'wallet', income: 'arrowIn', debt_return: 'undo', expense: 'cart', card_purchase: 'card', transfer: 'swap', reserve_topup: 'shield', savings_topup: 'piggy', loan_receipt: 'loan', repayment: 'check', interest: 'percent', fee: 'receipt', family: 'family', adjustment: 'edit' };
  var TX_COLOR = { salary: '#30D158', income: '#30D158', debt_return: '#66D4CF', transfer: '#0A84FF', reserve_topup: '#FF9F0A', savings_topup: '#BF5AF2', loan_receipt: '#8E8E93', repayment: '#0A84FF', interest: '#FF453A', fee: '#FF453A', family: '#BF5AF2', adjustment: '#8E8E93' };
  App.txSign = function (t) {
    var c = { salary: 1, income: 1, debt_return: 1, loan_receipt: 1, expense: -1, card_purchase: -1, family: -1, interest: -1, fee: -1, repayment: -1, transfer: 0, reserve_topup: 0, savings_topup: 0, adjustment: 0 }[t.type];
    return c;
  };
  App.txRow = function (t, accCtx) {
    var cat = t.categoryId && App.cat(t.categoryId);
    var useCat = cat && ['expense', 'card_purchase', 'salary', 'income'].indexOf(t.type) >= 0;
    var icon = useCat ? App.catIcon(cat) : '<span class="cat-ic" style="background:' + (TX_COLOR[t.type] || '#8E8E93') + '">' + I(TX_ICON[t.type] || 'dots') + '</span>';
    var title = useCat ? App.catName(cat) : App.TX_TYPES()[t.type];
    var from = App.acc(t.fromAccountId), to = App.acc(t.toAccountId);
    var sub = [from && from.name, to && to.name].filter(Boolean).join(' → ');
    if (t.note) sub += (sub ? ' · ' : '') + t.note;
    var amt, cls = '', cur = C.txCurrency(S.L, t);
    if (accCtx) {
      var eff = C.txEffects(S.L, Object.assign({}, t, { status: 'cleared' })).filter(function (e) { return e.acc === accCtx.id; }).reduce(function (s, e) { return s + e.delta; }, 0);
      if (C.isLiab(accCtx)) { amt = F(eff, accCtx.currency, { plus: true }); cls = eff > 0 ? 'neg' : 'pos'; }
      else { amt = F(eff, accCtx.currency, { plus: true }); cls = eff > 0 ? 'pos' : eff < 0 ? 'neg' : ''; }
    } else {
      var sg = App.txSign(t);
      var v = t.type === 'adjustment' ? t.amount : sg === -1 ? -t.amount : t.amount;
      amt = F(v, cur, { plus: sg === 1 }); cls = sg === 1 && (t.type !== 'loan_receipt') ? 'pos' : (t.type === 'expense' || t.type === 'card_purchase' || t.type === 'interest' || t.type === 'fee') ? 'neg' : '';
    }
    var tags = '';
    if (t.status === 'void') tags += ' <span class="tag">' + T('отменена', 'voided') + '</span>';
    if (t.type === 'loan_receipt') tags += ' <span class="tag">' + T('не доход', 'not income') + '</span>';
    if (t.plannedId) tags += ' <span class="tag warn">' + T('по плану', 'planned') + '</span>';
    var extra = '';
    if (t.type === 'repayment' && t.principal != null && t.principal !== t.amount) extra = T('осн. долг ', 'principal ') + F(t.principal, cur) + ' · ' + T('проценты/комиссии ', 'interest/fees ') + F(t.amount - t.principal, cur);
    return '<button class="row tap" data-a="modal" data-m="record" data-id="' + t.id + '"' + (t.status === 'void' ? ' style="opacity:.5"' : '') + '>' + icon +
      '<div class="main-t"><div class="t1">' + esc(title) + tags + '</div><div class="t2">' + esc(sub || '') + '</div>' + (extra ? '<div class="t2">' + esc(extra) + '</div>' : '') + '</div>' +
      '<div class="amt"><div class="num ' + cls + '"' + (t.status === 'void' ? ' style="text-decoration:line-through"' : '') + '>' + esc(amt) + '</div><div class="t2">' + esc(App.fd(t.date.slice(0, 10))) + '</div></div></button>';
  };
  App.txList = function (txs, accCtx, emptyText) {
    if (!txs.length) return '<div class="list"><div class="empty">' + I('log') + (emptyText || T('Записей пока нет. Нажмите «+», чтобы добавить операцию.', 'No records yet. Tap “+” to add one.')) + '</div></div>';
    var groups = {}, order = [];
    txs.forEach(function (t) { var d = t.date.slice(0, 10); if (!groups[d]) { groups[d] = []; order.push(d); } groups[d].push(t); });
    return order.map(function (d) { return '<div class="group-h"><span>' + esc(App.fd(d, true)) + '</span></div><div class="list" style="margin-top:0">' + groups[d].map(function (t) { return App.txRow(t, accCtx); }).join('') + '</div>'; }).join('');
  };
  App.sortTx = function (list) { return list.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1); }); };
  App.plannedRow = function (p, st, o) {
    o = o || {};
    var a = App.acc(p.accountId);
    var color = p.kind === 'income' ? 'var(--income)' : p.kind === 'family' ? 'var(--savings)' : p.kind === 'borrow' ? 'var(--text2)' : 'var(--planned)';
    var icon = p.kind === 'income' ? 'arrowIn' : p.kind === 'family' ? 'family' : p.kind === 'borrow' ? 'loan' : 'calendar';
    var amt = p.kind === 'income' || p.kind === 'borrow' ? (p.confirmed ? st.paid : p.amount) : st.open ? st.remaining : st.paid || p.amount;
    var sub = App.fd(p.date) + (p.dateConfirmed === false ? ' · ' + T('дата уточняется', 'date TBC') : '') + (a ? ' · ' + a.name : '') + ' · ' + T('бюдж. мес. ', 'budget ') + App.fymShort(p.budgetMonth);
    var btn = '';
    if (!o.noBtn) {
      if ((p.kind === 'payment' || p.kind === 'family') && st.open) btn = '<button class="btn sm' + (st.status === 'overdue' ? '' : ' sec') + '" data-a="modal" data-m="payPlanned" data-id="' + p.id + '">' + T('Оплатить', 'Pay') + '</button>';
      if (p.kind === 'income' && !p.confirmed && st.status !== 'skipped') btn = '<button class="btn sm sec" data-a="modal" data-m="confirmIncome" data-id="' + p.id + '">' + T('Подтвердить', 'Confirm') + '</button>';
      if (p.kind === 'borrow' && !p.confirmed) btn = '<span class="tag">' + T('сценарий', 'scenario') + '</span>';
    }
    return '<div class="row"><span class="cat-ic" style="background:' + color + '">' + I(icon) + '</span><div class="main-t tap" data-a="modal" data-m="editPlanned" data-id="' + p.id + '" style="cursor:pointer"><div class="t1">' + esc(p.title) + (p.scenario ? ' <span class="tag">' + T('сценарий', 'scenario') + '</span>' : '') + '</div><div class="t2">' + esc(sub) + '</div><div class="t2">' + App.pTag(st.status) + (st.partial ? ' <span class="tiny muted">' + T('оплачено ', 'paid ') + esc(F(st.paid)) + '</span>' : '') + '</div></div>' +
      '<div class="amt" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="num" style="color:' + color + '">' + esc(F(amt, p.currency)) + '</span>' + btn + '</div></div>';
  };
  App.accTile = function (a, bal) {
    var liab = C.isLiab(a), v = bal[a.id] || 0, sub = '';
    if (a.type === 'credit_card') { var ci = C.creditInfo(S.L, a, bal, S.today); sub = T('доступно ', 'avail. ') + F(ci.available, a.currency, { dec: 0 }); }
    else if (liab) sub = T('долг', 'debt');
    else if (a.balanceConfirmed === false) sub = T('предварительно', 'tentative');
    else sub = App.ACC_TYPES()[a.type];
    var dark = !App.isDarkColor(a.color);
    return '<button class="acc-tile' + (dark ? ' dark-text' : '') + '" style="background:' + a.color + '" data-a="go" data-s="account" data-id="' + a.id + '"><span class="shine"></span><div class="n">' + I(a.icon || 'bank', 'sm') + '<span>' + esc(a.name) + '</span></div><div><div class="v num">' + (liab && v > 0 ? '−' : '') + esc(F(Math.abs(v), a.currency)) + '</div><div class="s">' + esc(sub) + '</div></div></button>';
  };

  /* ---------- onboarding ---------- */
  App.screens.onboarding = function () {
    var L = App.lang();
    return '<div class="onb"><div class="logo">' + I('wallet') + '</div><h1>Akbar Finance 3.0</h1><p>' + T('Личные финансы: счета, кредиты, планирование, статистика. Данные хранятся только на этом устройстве.', 'Personal finance: accounts, credit, planning, statistics. Data stays on this device only.') + '</p>' +
      '<label class="btn block" style="cursor:pointer">' + I('upload') + T('Импортировать файл книги', 'Import ledger file') + '<input type="file" accept=".json,application/json" id="onbFile" data-ch="importPick" style="display:none"></label>' +
      '<button class="btn block sec" data-a="newLedger">' + I('plus') + T('Начать новую книгу', 'Start a new ledger') + '</button>' +
      '<div class="seg" style="margin-top:22px"><button class="' + (L === 'ru' ? 'on' : '') + '" data-a="setLangPre" data-l="ru">Русский</button><button class="' + (L === 'en' ? 'on' : '') + '" data-a="setLangPre" data-l="en">English</button></div>' +
      '<div class="dashed-note" style="text-align:left">' + T('Ваша личная книга (файл akbar-ledger-….json) не входит в код приложения. Импорт проверяет файл, защищает от дублей и всегда спрашивает подтверждение. Синхронизации между устройствами нет — переносите данные через экспорт/импорт JSON.', 'Your personal ledger (akbar-ledger-….json) is not part of the app code. Import validates the file, prevents duplicates and always asks for confirmation. There is no sync between devices — move data via JSON export/import.') + '</div></div>';
  };
  App.actions.setLangPre = function (el) { App.prefs.lang = el.dataset.l; App.savePrefs(); App.render(); };
  App.actions.importPick = function (el) { var f = el.files && el.files[0]; if (f) App.importFile(f); el.value = ''; };
  App.actions.newLedger = function () {
    var go = function () {
      var L = C.newLedger({ lang: App.lang(), today: S.today });
      L.accounts.push(C.makeAccount({ name: T('Наличные', 'Cash'), type: 'cash', color: '#30D158', icon: 'cash', openedAt: S.today }));
      C.log(L, 'ledger.new', 'New ledger');
      App.setLedger(L, 'new').then(function () { App.toast(T('Создана новая книга', 'New ledger created')); });
    };
    if (S.L) App.confirm(T('Новая книга', 'New ledger'), T('Текущая книга будет заменена пустой. Перед заменой сохранится автоматическая копия (Данные → Резервные копии). Продолжить?', 'The current ledger will be replaced with an empty one. An automatic snapshot is kept (Data → Backups). Continue?'), go, true);
    else go();
  };

  /* ---------- dashboard ---------- */
  App.screens.home = function () {
    var L = S.L, m = C.metrics(L, S.today), bal = m.balances;
    var own = L.accounts.filter(function (a) { return !C.isLiab(a) && !a.archived && !a.closed; });
    var liabs = L.accounts.filter(function (a) { return C.isLiab(a) && !a.archived && !a.closed; });
    var h = '';
    // accounts (own money and credit are shown separately)
    h += '<div class="sec-h" style="margin-top:0"><span class="t">' + T('Мои счета', 'My accounts') + '</span><button data-a="go" data-s="accounts">' + T('Все', 'All') + '</button></div>';
    h += '<div class="acc-grid">' + own.map(function (a) { return App.accTile(a, bal); }).join('') + '<button class="acc-tile add" data-a="modal" data-m="account">' + I('plus', 'sm') + T('Счёт', 'Account') + '</button></div>';
    if (liabs.length) h += '<div class="sec-h"><span class="t">' + T('Кредиты и долги', 'Credit & debts') + '</span><button data-a="go" data-s="debts">Debt Freedom</button></div><div class="acc-grid">' + liabs.map(function (a) { return App.accTile(a, bal); }).join('') + '</div>';
    if (m.unconvertible.length) h += '<div class="alert warn">' + I('alert') + '<div class="grow">' + T('Нет курса для: ', 'No rate for: ') + esc(m.unconvertible.join(', ')) + '. <a href="#" data-a="go" data-s="currencies">' + T('Указать курс', 'Set rate') + '</a></div></div>';
    // main balance card
    h += '<div class="grid2">';
    h += '<div class="card hero span2"><div class="lbl">' + T('Собственные средства', 'Own money') + '</div><div class="big num">' + esc(F(m.own)) + '</div><div class="kpis">' +
      kpi(T('Свободно после обязательств', 'Free after obligations'), F(m.free), m.free < 0 ? 'neg' : 'pos', T('обязательства до ', 'obligations until ') + App.fd(m.horizon) + ': ' + F(m.obligations)) +
      kpi(T('Зарезервировано', 'Reserved'), F(m.reserved + m.savings), 'sav', T('резерв ', 'reserve ') + F(m.reserved) + ' · ' + T('накопл. ', 'savings ') + F(m.savings)) +
      kpi(T('Общая задолженность', 'Total debt'), F(m.debt), 'neg', T('краткосрочная ', 'short-term ') + F(m.shortDebt)) +
      kpi(T('Чистый капитал', 'Net worth'), F(m.netWorth), m.netWorth < 0 ? 'neg' : 'pos', T('подтверждённые активы − долги', 'confirmed assets − debts')) +
      '</div><div class="tiny muted mt8">' + T('Кредитные лимиты не включены в собственные средства.', 'Credit limits are not included in own money.') + '</div></div>';
    // month card
    var dev = m.incomeDeviation, devPct = m.incomeDeviationPct;
    h += '<div class="card tap" data-a="go" data-s="income"><div class="card-h"><span class="t">' + esc(App.fym(C.ymOf(S.today))) + '</span><span class="more">' + T('План доходов', 'Income plan') + I('chev', 'sm') + '</span></div><div class="kpis">' +
      kpi(T('Доход месяца', 'Income this month'), F(m.monthIncome), 'pos', T('заработано ', 'earned ') + F(m.monthEarned)) +
      kpi(T('Расход месяца', 'Spending this month'), F(m.monthExpense), 'neg', T('проценты/комиссии ', 'interest/fees ') + F(m.monthFinance)) +
      kpi(T('Плановый доход', 'Planned income'), F(m.plannedIncome), 'plan', T('бюджетный месяц ', 'budget month ') + App.fymShort(m.budgetMonth)) +
      kpi(T('Фактический доход', 'Actual income'), F(m.actualIncome), 'pos', T('отклонение ', 'deviation ') + App.FS(dev) + (devPct != null ? ' (' + App.pct(devPct) + ')' : '')) +
      '</div></div>';
    // warnings
    var notes = C.notifications(L, S.today).filter(function (n) { return !n.dismissed && n.level !== 'ok'; });
    h += '<div class="card"><div class="card-h"><span class="t">' + T('Финансовые риски', 'Financial risks') + '</span><button class="more" data-a="go" data-s="notifications">' + T('Все', 'All') + I('chev', 'sm') + '</button></div>' +
      (notes.length ? notes.slice(0, 4).map(App.noteHtml).join('') : '<div class="alert ok">' + I('check') + '<div class="grow">' + T('Активных предупреждений нет', 'No active warnings') + '</div></div>') + '</div>';

    h += '<div id="incTot" class="card">' + App.kv(T('Итого', 'Total'), F(total)) + App.kv(T('Отклонение от плана', 'Deviation from plan'), '<span class="' + (diff < 0 ? 'neg' : 'pos') + '">' + esc(App.FS(diff)) + ' (' + App.pct(p.amount ? diff / p.amount : null) + ')</span>', true) + '</div>' + errBox(m);
    h += '<button class="btn block mt16" data-a="confirmIncomeGo">' + I('check') + T('Подтвердить поступление', 'Confirm income') + '</button>';
    m.liveFn = function () { var tot = keys.reduce(function (s, k) { return s + (App.toMinor(S.modal.f[k[0]]) || 0); }, 0), d = tot - p.amount; var el = document.getElementById('incTot'); if (el) el.innerHTML = App.kv(T('Итого', 'Total'), F(tot)) + App.kv(T('Отклонение от плана', 'Deviation from plan'), '<span class="' + (d < 0 ? 'neg' : 'pos') + '">' + esc(App.FS(d)) + ' (' + App.pct(p.amount ? d / p.amount : null) + ')</span>', true); };
    return { title: T('Подтвердить поступление', 'Confirm income'), html: h };
  };
  App.actions.confirmIncomeGo = function (el) {
    var m = S.modal, f = m.f; if (m.busy) return; m.busy = true; el.disabled = true;
    var parts = {}; ['salary', 'tips', 'service', 'debtReturn', 'extra', 'other'].forEach(function (k) { var v = App.toMinor(f[k]); if (v > 0) parts[k] = v; });
    var res = App.commit(T('Поступление подтверждено', 'Income confirmed'), function (L) { return C.confirmPlanned(L, m.id, { opKey: m.opKey, parts: parts, date: f.date, toAccountId: f.to }); });

  };
  App.actions.unconfirmIncome = function () { var id = S.modal.id; App.closeModal(); App.commit(T('Подтверждение отменено', 'Confirmation undone'), function (L) { return C.unconfirmPlanned(L, id); }); };

  /* ---------- add / edit planned item (payment, income, family, recurring) ---------- */
  App.modals.editPlanned = function (m) {
    var L = S.L, p = m.id ? C.byId(L.planned, m.id) : null, f = m.f;
    if (!m.inited) {
      m.inited = true;
      if (p) Object.assign(f, { kind: p.kind, title: p.title, amount: App.amtStr(p.amount), date: p.date, dateConfirmed: p.dateConfirmed !== false, budgetMonth: p.budgetMonth, accountId: p.accountId || '', from: p.fromAccountId || '', to: p.toAccountId || '', interest: App.amtStr(p.interestPart), note: p.note || '', series: false, debtAmount: App.amtStr(p.debtAmount), category: p.categoryId || '' });
      else Object.assign(f, { kind: m.kind || 'payment', title: '', amount: '', date: S.today, dateConfirmed: true, budgetMonth: C.ymOf(S.today), accountId: m.acc || '', from: (L.accounts.filter(function (a) { return own(a) && !a.role; })[0] || {}).id || '', to: (L.accounts.filter(function (a) { return own(a) && !a.role; })[0] || {}).id || '', interest: '', note: '', repeat: false, count: '12', bmShift: m.kind === 'income' || m.kind === 'family' ? '1' : '0', category: 'misc' });
    }

      if (f.accountId) x += fld(T('Из них проценты', 'of which interest'), inp('interest', f.interest, { num: true, ph: T('если известно', 'if known') }));

      h += '<div class="btns">';
      if ((p.kind === 'payment' || p.kind === 'family') && st.open) h += '<button class="btn" data-a="modal" data-m="payPlanned" data-id="' + p.id + '">' + T('Оплатить', 'Pay') + '</button>';
      if (p.kind === 'income' && !p.confirmed) h += '<button class="btn" data-a="modal" data-m="confirmIncome" data-id="' + p.id + '">' + T('Подтвердить', 'Confirm') + '</button>';

  /* ---------- reconcile with a bank statement ---------- */
  App.modals.reconcile = function (m) {
    var a = App.acc(m.id), bal = C.balances(S.L)[a.id], f = m.f, liab = C.isLiab(a);

    m.liveFn = function () { var s = App.toMinor(S.modal.f.stmt), d = s == null ? 0 : s - bal; var el = document.getElementById('recDiff'); if (el) el.innerHTML = App.kv(T('Расхождение', 'Difference'), '<span class="' + (d ? 'neg' : 'pos') + '">' + esc(F(d, a.currency, { plus: true })) + '</span>', true); };
    return { title: T('Сверка: ', 'Reconcile: ') + a.name, html: h };
  };
  App.actions.reconcileGo = function () {
    var m = S.modal, a = App.acc(m.id), bal = C.balances(S.L)[a.id], stmt = App.toMinor(m.f.stmt);

      acc.reconciledAt = (m.f.date || S.today) + 'T23:59'; acc.reconciledBalance = stmt; acc.balanceConfirmed = true;
    });

  };

  /* ---------- account create / edit (Wallet "New account" logic) ---------- */
  var COLORS = ['#0A84FF', '#30D158', '#FF9F0A', '#FF453A', '#BF5AF2', '#64D2FF', '#FFD60A', '#FF375F', '#5E5CE6', '#0E7C66', '#E5484D', '#2EC4B6', '#3BFFC1', '#8E8E93', '#AC8E68', '#1C1C1E'];
  var ICONS = ['bank', 'cash', 'card', 'piggy', 'shield', 'loan', 'invest', 'wallet', 'calendar', 'bolt', 'home', 'briefcase', 'globe', 'target'];
  App.modals.account = function (m) {
    var a = m.id ? App.acc(m.id) : null, f = m.f;

      m.inited = true;
      if (a) { Object.assign(f, { name: a.name, type: a.type, currency: a.currency, initial: App.amtStr(a.initialBalance), color: a.color, icon: a.icon, note: a.note, role: a.role || '', term: a.term || 'short', institution: a.institution || '', balanceConfirmed: a.balanceConfirmed !== false }); if (a.credit) Object.keys(a.credit).forEach(function (k) { f['c_' + k] = a.credit[k]; }); if (a.loan) Object.keys(a.loan).forEach(function (k) { f['l_' + k] = a.loan[k]; }); ['c_limit', 'c_statementBalance', 'c_minPayment', 'l_monthlyPayment'].forEach(function (k) { if (f[k] != null) f[k] = App.amtStr(f[k]); }); }
      else Object.assign(f, { name: '', type: m.type || 'checking', currency: 'AED', initial: '', color: '#0A84FF', icon: 'bank', note: '', role: '', term: 'short', institution: '', balanceConfirmed: true });

    if (!a) h += '<div class="acc-grid" style="margin-bottom:12px">' + C.ACCOUNT_TYPES.map(function (t) { var ic = { cash: 'cash', checking: 'bank', credit_card: 'card', savings: 'piggy', investment: 'invest', loan: 'loan', other: 'wallet' }[t]; return '<button class="acc-tile" style="background:' + (f.type === t ? 'var(--accent)' : 'var(--card2)') + ';color:' + (f.type === t ? '#fff' : 'var(--text)') + ';min-height:56px" data-a="accType" data-t="' + t + '"><div class="n">' + I(ic, 'sm') + '<span>' + esc(App.ACC_TYPES()[t]) + '</span></div></button>'; }).join('') + '</div>';
    var liab = f.type === 'credit_card' || f.type === 'loan';
    var x = fld(T('Название', 'Name'), inp('name', f.name, { ph: T('например, Основная карта', 'e.g. Main card') })) + (a ? fld(T('Тип', 'Type'), sel('type', App.opts(C.ACCOUNT_TYPES.map(function (t) { return [t, App.ACC_TYPES()[t]]; }), f.type), { re: 1 })) : '') +
      fld(T('Валюта', 'Currency'), sel('currency', App.opts(C.CURRENCIES.concat(Object.keys(S.L.rates).filter(function (c) { return C.CURRENCIES.indexOf(c) < 0; })).map(function (c) { return [c, c]; }), f.currency))) +
      fld(liab ? T('Начальный долг', 'Opening debt') : T('Начальный баланс', 'Opening balance'), inp('initial', f.initial, { num: true, ph: '0' })) +
      fld(T('Банк / организация', 'Institution'), inp('institution', f.institution)) +
      fld(T('Остаток подтверждён', 'Balance confirmed'), chk('balanceConfirmed', f.balanceConfirmed));
    if (a) x += fld(liab ? T('Текущий долг', 'Current debt') : T('Текущий баланс', 'Current balance'), '<span class="num">' + esc(F(C.balances(S.L)[a.id], a.currency)) + '</span>');
    if (f.type === 'savings' || f.type === 'other' || f.type === 'cash' || f.type === 'checking') x += fld(T('Назначение', 'Role'), sel('role', App.opts([['', T('свободные деньги', 'spendable')], ['reserve', T('резерв', 'reserve')], ['savings', T('накопления', 'savings')]], f.role)));
    if (liab) x += fld(T('Срок', 'Term'), sel('term', App.opts([['short', T('краткосрочный', 'short-term')], ['long', T('долгосрочный', 'long-term')]], f.term)));
    var c = '';
    if (f.type === 'credit_card') c = group(T('Кредитная карта', 'Credit card'), fld(T('Кредитный лимит', 'Credit limit'), inp('c_limit', f.c_limit, { num: true })) + fld(T('Сумма выписки', 'Statement balance'), inp('c_statementBalance', f.c_statementBalance, { num: true })) + fld(T('Минимальный платёж', 'Minimum payment'), inp('c_minPayment', f.c_minPayment, { num: true })) + fld(T('Дата платежа', 'Due date'), inp('c_dueDate', f.c_dueDate, { type: 'date' })) + fld(T('Дата платежа подтверждена', 'Due date confirmed'), chk('c_dueDateConfirmed', f.c_dueDateConfirmed !== false)) + fld(T('Дата выписки', 'Statement date'), inp('c_statementDate', f.c_statementDate, { type: 'date' })) + fld(T('Расчётный период', 'Billing cycle'), inp('c_billingCycle', f.c_billingCycle, { ph: T('напр. 5–4 число', 'e.g. 5th–4th') })) + fld(T('Ставка, % годовых', 'APR, %'), inp('c_apr', f.c_apr, { num: true, ph: T('не подтверждена', 'unconfirmed') })) + fld(T('Ставка подтверждена', 'Rate confirmed'), chk('c_aprConfirmed', f.c_aprConfirmed)) + fld(T('Комиссии', 'Fees'), inp('c_fees', f.c_fees)) + fld(T('Комиссии подтверждены', 'Fees confirmed'), chk('c_feesConfirmed', f.c_feesConfirmed)), T('Неизвестные ставки и даты не заменяются нулём — они помечаются как неподтверждённые.', 'Unknown rates and dates are never assumed to be zero — they are marked unconfirmed.'));
    if (f.type === 'loan') c = group(T('Кредит', 'Loan'), fld(T('Ежемесячный платёж', 'Monthly payment'), inp('l_monthlyPayment', f.l_monthlyPayment, { num: true })) + fld(T('Плановое завершение', 'Planned end'), inp('l_endDate', f.l_endDate, { type: 'month' })) + fld(T('День списания', 'Payment day'), inp('l_paymentDay', f.l_paymentDay, { num: true })) + fld(T('День подтверждён', 'Day confirmed'), chk('l_paymentDayConfirmed', f.l_paymentDayConfirmed)) + fld(T('Ставка, % годовых', 'APR, %'), inp('l_apr', f.l_apr, { num: true, ph: T('не подтверждена', 'unconfirmed') })) + fld(T('Ставка подтверждена', 'Rate confirmed'), chk('l_aprConfirmed', f.l_aprConfirmed)) + fld(T('Комиссии', 'Fees'), inp('l_fees', f.l_fees)));
    h += '<div class="form">' + group('', x) + c + group(T('Вид', 'Look'), '<div class="fld col"><label>' + T('Цвет', 'Color') + '</label><div class="chips">' + COLORS.map(function (col) { return '<button data-a="accColor" data-c="' + col + '" style="width:30px;height:30px;border-radius:50%;background:' + col + ';outline:' + (f.color === col ? '3px solid var(--text)' : '0') + ';outline-offset:2px"></button>'; }).join('') + '</div></div><div class="fld col"><label>' + T('Иконка', 'Icon') + '</label><div class="chips">' + ICONS.map(function (ic) { return '<button class="chip' + (f.icon === ic ? ' on' : '') + '" data-a="accIcon" data-i="' + ic + '">' + I(ic, 'sm') + '</button>'; }).join('') + '</div></div>' + fld(T('Комментарий', 'Note'), inp('note', f.note), { col: 1 })) + '</div>';
    if (a) {
      var used = S.L.transactions.some(function (t) { return t.fromAccountId === a.id || t.toAccountId === a.id; }) || S.L.planned.some(function (p) { return p.accountId === a.id || p.fromAccountId === a.id || p.toAccountId === a.id; });
      h += '<div class="btns"><button class="btn sec" data-a="accArchive">' + (a.archived ? T('Вернуть из архива', 'Unarchive') : T('В архив', 'Archive')) + '</button><button class="btn sec" data-a="accClose">' + (a.closed ? T('Открыть снова', 'Reopen') : C.isLiab(a) ? T('Закрыть кредитную линию', 'Close credit line') : T('Закрыть счёт', 'Close account')) + '</button></div>';
      if (!used) h += '<div class="btns"><button class="btn danger" data-a="accDelete">' + I('trash') + T('Удалить счёт', 'Delete account') + '</button></div>';
      else h += '<div class="tiny muted mt8">' + T('Счёт с операциями нельзя удалить — его можно архивировать или закрыть. Полное погашение не закрывает кредитную линию автоматически.', 'An account with records cannot be deleted — archive or close it. Full repayment does not close a credit line automatically.') + '</div>';
    }
    h += errBox(m);
    return { title: a ? T('Настройки счёта', 'Account settings') : T('Новый счёт', 'New account'), html: h, done: 'saveAccount', doneLabel: T('Сохранить', 'Save') };
  };
  App.actions.accType = function (el) { S.modal.f.type = el.dataset.t; var ic = { cash: 'cash', checking: 'bank', credit_card: 'card', savings: 'piggy', investment: 'invest', loan: 'loan', other: 'wallet' }[el.dataset.t]; S.modal.f.icon = ic; App.renderModal(); };
  App.actions.accColor = function (el) { S.modal.f.color = el.dataset.c; App.renderModal(); };
  App.actions.accIcon = function (el) { S.modal.f.icon = el.dataset.i; App.renderModal(); };
  App.actions.saveAccount = function () {
    var m = S.modal, f = m.f;
    if (!f.name) { m.err = T('Введите название', 'Enter a name'); App.renderModal(); return; }
    var init = App.toMinor(f.initial || '0'); if (init == null) { m.err = T('Неверная сумма', 'Invalid amount'); App.renderModal(); return; }
    var num = function (k) { var v = App.toMinor(f[k]); return v == null || f[k] === '' || f[k] == null ? null : v; };
    var fl = function (k) { return f[k] === '' || f[k] == null ? null : parseFloat(String(f[k]).replace(',', '.')); };
    var o = { name: f.name, type: f.type, currency: f.currency, initialBalance: init, color: f.color, icon: f.icon, note: f.note || '', role: f.role || null, institution: f.institution || '', balanceConfirmed: !!f.balanceConfirmed };
    if (f.type === 'credit_card' || f.type === 'loan') { o.term = f.term || 'short'; o.role = null; }
    if (f.type === 'credit_card') o.credit = { limit: num('c_limit') || 0, statementBalance: num('c_statementBalance'), minPayment: num('c_minPayment'), dueDate: f.c_dueDate || null, dueDateConfirmed: f.c_dueDateConfirmed !== false, statementDate: f.c_statementDate || null, billingCycle: f.c_billingCycle || '', apr: fl('c_apr'), aprConfirmed: !!f.c_aprConfirmed, fees: f.c_fees || '', feesConfirmed: !!f.c_feesConfirmed };
    if (f.type === 'loan') { var prev = m.id ? (App.acc(m.id).loan || {}) : {}; o.loan = Object.assign({}, prev, { monthlyPayment: num('l_monthlyPayment'), endDate: f.l_endDate || null, paymentDay: f.l_paymentDay || null, paymentDayConfirmed: !!f.l_paymentDayConfirmed, apr: fl('l_apr'), aprConfirmed: !!f.l_aprConfirmed, fees: f.l_fees || '', principal: prev.principal != null ? prev.principal : init }); }
    App.commit(m.id ? T('Счёт изменён', 'Account updated') : T('Счёт создан', 'Account created'), function (L) {
      if (m.id) { var a = C.byId(L.accounts, m.id); Object.assign(a, o); if (o.type !== 'credit_card') delete a.credit; if (o.type !== 'loan') delete a.loan; }
      else L.accounts.push(C.makeAccount(Object.assign(o, { openedAt: S.today })));
    });
    App.closeModal();
  };
  App.actions.accArchive = function () { var id = S.modal.id; App.closeModal(); App.commit(T('Архив обновлён', 'Archive updated'), function (L) { var a = C.byId(L.accounts, id); a.archived = !a.archived; }); };
  App.actions.accClose = function () { var id = S.modal.id; App.closeModal(); App.commit(T('Статус счёта изменён', 'Account status changed'), function (L) { var a = C.byId(L.accounts, id); a.closed = !a.closed; a.closedAt = a.closed ? new Date().toISOString() : null; }); };
  App.actions.accDelete = function () { var id = S.modal.id; App.confirm(T('Удалить счёт?', 'Delete account?'), T('Счёт без операций будет удалён.', 'The account (no records) will be deleted.'), function () { App.commit(T('Счёт удалён', 'Account deleted'), function (L) { L.accounts = L.accounts.filter(function (a) { return a.id !== id; }); }); App.setTab('home'); }, true, T('Удалить', 'Delete')); };
})();

<script>
/* Import preview, month review, category/goal/project/asset editors */
(function () {
  'use strict';
  var App = window.App, C = App.C, I = App.I, S = App.S, T = App.T, F = App.F, esc = App.esc;
  var fld = App.fld, inp = App.inp, sel = App.sel, chk = App.chk, group = App.group;

  /* ---------- import with validation, dedupe and confirmation ---------- */
  App.modals.importPreview = function (m) {
    var v = m.v, h = '<div class="card"><div class="b">' + esc(m.fileName || '') + '</div>';
    if (!v.ok) {
      h += '<div class="alert danger">' + I('alert') + '<div class="grow">' + T('Файл не прошёл проверку. Данные не изменены.', 'The file failed validation. Nothing was changed.') + '<br><span class="tiny">' + esc(v.errors.slice(0, 12).join('; ')) + (v.errors.length > 12 ? ' …' : '') + '</span></div></div></div>';
      return { title: T('Импорт', 'Import'), html: h };
    }
    var n = C.normalizeLedger(m.obj);
    h += App.kv(T('Счетов', 'Accounts'), String(v.stats.accounts)) + App.kv(T('Операций', 'Records'), String(v.stats.transactions)) + App.kv(T('Плановых операций', 'Planned items'), String(v.stats.planned)) + App.kv(T('Целей', 'Goals'), String(v.stats.goals)) + App.kv(T('Дата данных', 'Data as of'), (m.obj.meta && m.obj.meta.asOf) || '—');
    if (n.removed) h += '<div class="alert warn">' + I('alert') + '<div class="grow">' + T('Найдено и будет пропущено дублей операций: ', 'Duplicate records found and skipped: ') + n.removed + '</div></div>';
    if (v.warnings.length) h += '<div class="tiny muted mt8">' + esc(v.warnings.join('; ')) + '</div>';
    h += '<div class="alert ok">' + I('check') + '<div class="grow">' + T('Проверка пройдена: структура, суммы в филсах (целые), ссылки на счета.', 'Validation passed: structure, integer fils amounts, account references.') + '</div></div></div>';
    if (S.L) {
      h += '<div class="form">' + group('', fld(T('Я понимаю, что текущая книга будет заменена', 'I understand the current ledger will be replaced'), chk('agree', m.f.agree, { re: 1 }))) + '</div>';
      h += '<div class="btns"><button class="btn danger" data-a="importReplace"' + (m.f.agree ? '' : ' disabled') + '>' + T('Заменить книгу', 'Replace ledger') + '</button><button class="btn sec" data-a="importMerge">' + T('Объединить (без дублей)', 'Merge (no duplicates)') + '</button></div>';
      h += '<div class="tiny muted mt8">' + T('Перед заменой текущая книга автоматически сохраняется в резервные копии на этом устройстве.', 'Before replacing, the current ledger is saved to on-device backups automatically.') + '</div>';
    } else h += '<button class="btn block mt16" data-a="importReplace">' + I('download') + T('Загрузить книгу', 'Load ledger') + '</button>';
    return { title: T('Импорт книги', 'Import ledger'), html: h };
  };
  App.actions.importReplace = function () {
    var m = S.modal; if (S.L && !m.f.agree) return;
    var n = C.normalizeLedger(m.obj); C.log(n.ledger, 'import.replace', (m.fileName || '') + (n.removed ? ', duplicates skipped ' + n.removed : ''));
    App.closeModal(); App.setLedger(n.ledger, 'import').then(function () { App.toast(T('Книга загружена', 'Ledger loaded')); });
  };
  App.actions.importMerge = function () {
    var m = S.modal, inc = C.normalizeLedger(m.obj).ledger;
    var r = C.mergeLedger(S.L, inc);
    App.closeModal();
    AFDB.addSnapshot('before:merge', S.L).then(function () { S.L = r.ledger; App.save(); App.render(); App.toast(T('Добавлено операций: ', 'Records added: ') + r.added.transactions + T(', пропущено дублей: ', ', duplicates skipped: ') + r.skipped); });
  };

  /* ---------- month-end review ---------- */
  App.modals.review = function (m) {
    var ym = m.ym || C.ymOf(S.today), r = C.monthReview(S.L, ym, S.today), h = '';
    h += '<div class="seg"><button data-a="reviewShift" data-d="-1">‹ ' + esc(App.fym(C.addMonths(ym, -1))) + '</button><button class="on">' + esc(App.fym(ym)) + '</button><button data-a="reviewShift" data-d="1">' + esc(App.fym(C.addMonths(ym, 1))) + ' ›</button></div>';
    var q = function (qq, a) { return '<div class="kv"><span class="k">' + esc(qq) + '</span><span class="v">' + a + '</span></div>'; };
    h += '<div class="card">' +
      q(T('Сколько поступило денег?', 'How much came in?'), '<span class="pos">' + esc(F(r.received)) + '</span>') +
      q(T('Сколько потрачено?', 'How much was spent?'), '<span class="neg">' + esc(F(r.spent)) + '</span> <span class="tiny muted">+ ' + T('проценты/комиссии ', 'interest/fees ') + esc(F(r.finance)) + '</span>') +
      q(T('Сколько отправлено родителям?', 'Sent to parents?'), '<span class="sav">' + esc(F(r.family)) + '</span>') +
      q(T('Сколько накоплено?', 'How much saved?'), esc(App.FS(r.saved))) +
      q(T('Как изменился долг?', 'How did debt change?'), '<span class="' + (r.debtChange > 0 ? 'neg' : 'pos') + '">' + esc(App.FS(r.debtChange)) + '</span> <span class="tiny muted">' + esc(F(r.debtStart)) + ' → ' + esc(F(r.debtEnd)) + '</span>') +
      q(T('Прогноз следующего месяца', 'Next month forecast'), '<span class="' + (r.nextPlan.result < 0 ? 'neg' : 'pos') + '">' + esc(F(r.nextPlan.result)) + '</span>') + '</div>';
    h += '<div class="sec-h"><span class="t small">' + T('Какие платежи выполнены?', 'Which payments were made?') + '</span></div><div class="list">' + (r.payments.length ? r.payments.map(function (x) { return App.plannedRow(x.p, x.st); }).join('') : '<div class="empty">—</div>') + '</div>';
    if (r.incomes.length) h += '<div class="sec-h"><span class="t small">' + T('Подтвердите поступления', 'Confirm income') + '</span></div><div class="list">' + r.incomes.map(function (p) { return App.plannedRow(p, C.plannedState(S.L, p, S.today)); }).join('') + '</div>';
    h += '<div class="tiny muted mt8">' + T('После подтверждения поступлений план пересчитывается автоматически.', 'After confirming income the plan is recalculated automatically.') + '</div>';
    return { title: T('Финансовая сверка месяца', 'Monthly review'), html: h };
  };
  App.actions.reviewShift = function (el) { S.modal.ym = C.addMonths(S.modal.ym || C.ymOf(S.today), +el.dataset.d); App.renderModal(); };

  /* ---------- category editor ---------- */
  App.modals.category = function (m) {

<script>

(function () {

  App.screens.planning = function () {
    var L = S.L, h = '<div class="grid2">';

    h += card('Planned Payments · ' + T('Платежи', 'Payments'), '<div class="kpis">' + kpi(T('В ближайшие 45 дней', 'Next 45 days'), F(C.sum(up, function (x) { return x.st.remaining; })), 'plan', up.length + T(' платежей', ' items')) + kpi(T('Просрочено', 'Overdue'), String(up.filter(function (x) { return x.st.status === 'overdue'; }).length), 'neg') + '</div>' + up.slice(0, 3).map(function (x) { return '<div class="split small mt8"><span class="ellipsis">' + esc(App.fd(x.p.date)) + ' · ' + esc(x.p.title) + '</span><span class="num plan">' + esc(F(x.st.remaining)) + '</span></div>'; }).join(''), 'planned');
    var bs = C.budgetStatus(L, C.ymOf(S.today), S.today);
    h += card('Budgets · ' + T('Бюджеты', 'Budgets'), '<div class="split small"><span class="muted">' + T('Личные расходы', 'Personal spending') + '</span><span class="num">' + esc(F(bs.total.spent)) + ' / ' + esc(F(bs.total.limit)) + '</span></div><div class="bar mt8"><i style="width:' + Math.min(100, bs.total.pct * 100) + '%;background:' + (bs.total.exceeded ? 'var(--expense)' : 'var(--income)') + '"></i></div><div class="tiny muted mt8">' + T('Можно тратить в день: ', 'Daily allowance: ') + esc(F(bs.total.daily)) + '</div>', 'budgets');
    var nextInc = L.planned.filter(function (p) { return p.kind === 'income' && !p.confirmed && !p.scenario; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
    var incPlan = C.sum(L.planned.filter(function (p) { return p.kind === 'income' && !p.scenario; }), function (p) { return p.amount; });
    h += card('Income Plan · ' + T('Доходы', 'Income'), '<div class="kpis">' + kpi(T('Всего ожидается', 'Total expected'), F(incPlan), 'pos') + kpi(T('Следующее', 'Next'), nextInc ? F(nextInc.amount) : '—', 'plan', nextInc ? App.fd(nextInc.date, true) + ' → ' + App.fymShort(nextInc.budgetMonth) : '') + '</div>', 'income');

  /* ---------- planned payments list ---------- */

    h += '<div class="chips">' + [['', T('Все типы', 'All kinds')], ['payment', T('Платежи', 'Payments')], ['income', T('Доходы', 'Income')], ['family', T('Родителям', 'Parents')], ['scenario', T('Сценарии', 'Scenarios')]].map(function (x) { return '<button class="chip' + (kind === x[0] ? ' on' : '') + '" data-a="plKind" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';

  App.screens.family = function () {

  };

  /* ---------- budget periods (December / January plans etc.) ---------- */
  App.screens.monthplan = function () {
    var L = S.L, ym = S.ui.planYm || C.firstPlanMonth(L), opts = { today: S.today, scenarios: scen() };
    var mp = C.monthPlan(L, ym, opts), h = monthNav('planYm', ym);

    var rows = mp.items.map(function (i) {
      var title = i.kind === 'personal' ? T('Личные расходы', 'Personal spending') + (i.actual ? ' <span class="tiny muted">(' + T('факт ', 'actual ') + esc(F(i.actual)) + ')</span>' : '') : i.kind === 'unplannedIn' ? T('Внеплановые поступления (факт)', 'Unplanned income (actual)') : i.kind === 'unplannedOut' ? T('Внеплановые выплаты (факт)', 'Unplanned payments (actual)') : esc(i.title) + (i.kind === 'income' ? ' <span class="tiny muted">' + esc(App.fd(i.date, true)) + '</span>' : '') + (i.scenario ? ' <span class="tag">' + T('сценарий', 'scenario') + '</span>' : '') + (i.status ? ' ' + App.pTag(i.status) : '');

    }).join('');
    h += '<div class="card"><div class="card-h"><span class="t">' + T('Финансовый план: ', 'Financial plan: ') + esc(App.fym(ym)) + '</span></div><div class="tbl-wrap"><table class="tbl"><tr><th>' + T('Статья', 'Item') + '</th><th class="r">AED</th></tr>' + rows + '<tr class="total"><td>' + (mp.result < 0 ? T('Дефицит', 'Deficit') : T('Прогнозный остаток', 'Projected surplus')) + '</td><td class="r num ' + (mp.result < 0 ? 'neg' : 'pos') + '">' + esc(F(mp.result)) + '</td></tr></table></div>' + (function () { var cp = mp.items.filter(function (i) { return i.kind === 'payment'; }); var tot = -cp.reduce(function (s, i) { return s + i.amount; }, 0); return cp.length ? '<div class="kv mt8"><span class="k">' + T('Итого платежей по кредитам за период', 'Total credit payments this period') + '</span><span class="v num neg">' + esc(F(tot)) + '</span></div>' : ''; })() + '</div>';
    if (mp.result < 0) {
      var alt = C.deficitAlternatives(L, ym, opts);
      h += '<div class="alert danger">' + I('alert') + '<div class="grow"><b>' + T('Кассовый разрыв ', 'Cash gap ') + esc(F(alt.deficit)) + '</b>. ' + T('Альтернативы без нового заимствования:', 'Alternatives without new borrowing:') + '<ul style="margin:6px 0 0;padding-left:18px">' + alt.alts.map(function (a) {

        if (a.id === 'shiftFamily') return '<li>' + T('Перенести ', 'Move ') + esc(F(a.amount)) + T(' перевода родителям на ', ' of the parents transfer to ') + esc(App.fym(a.nextYm)) + ': ' + T('остаток следующего периода станет ', 'next period becomes ') + '<span class="' + (a.feasible ? 'pos' : 'neg') + '">' + esc(F(a.nextResultAfter)) + '</span></li>';

        if (a.id === 'minPayments') return '<li>' + T('Платить по кредитным картам только минимальные платежи (если это ещё не заложено в план)', 'Pay only credit card minimums (if not already planned)') + '</li>';

      }).join('') + '</ul></div></div>';
    }

    var first = C.firstPlanMonth(L), last = C.lastPlanMonth(L), n = Math.max(1, (+last.slice(0, 4) - +first.slice(0, 4)) * 12 + (+last.slice(5, 7) - +first.slice(5, 7)) + 1);
    var ser = C.planSeries(L, first, n, opts);
    h += '<div class="card"><div class="card-h"><span class="t">' + T('Все бюджетные периоды', 'All budget periods') + '</span></div><div class="tbl-wrap"><table class="tbl"><tr><th>' + T('Месяц', 'Month') + '</th><th class="r">' + T('Поступления', 'Income') + '</th><th class="r">' + T('Выплаты', 'Out') + '</th><th class="r">' + T('Остаток', 'Result') + '</th><th class="r">' + T('Накопительно', 'Cumulative') + '</th></tr>' +
      ser.map(function (r) { return '<tr' + (r.ym === ym ? ' style="background:var(--card2)"' : '') + '><td>' + esc(App.fymShort(r.ym)) + '</td><td class="r num">' + esc(F(r.income, 'AED', { dec: 0 })) + '</td><td class="r num">' + esc(F(-r.out, 'AED', { dec: 0 })) + '</td><td class="r num ' + (r.result < 0 ? 'neg' : 'pos') + '">' + esc(F(r.result)) + '</td><td class="r num ' + (r.cumulative < 0 ? 'neg' : '') + '">' + esc(F(r.cumulative)) + '</td></tr>'; }).join('') + '</table></div>' +
      CH.bars({ id: 'serBars', groups: ser.map(function (r) { return { label: App.fymShort(r.ym), tip: App.fym(r.ym), values: [{ v: r.result, color: r.result < 0 ? 'var(--expense)' : 'var(--income)', planned: true, name: T('остаток', 'result') }] }; }), fmtTip: function (v) { return F(v); } }) + '</div>';

    return { title: T('Бюджетные периоды', 'Budget periods'), html: h };

  /* potential savings: periods after the last planned short-term debt payment, up to 5 */
  App.potentialSavings = function (L, opts) {
    var lastShort = ''; L.planned.forEach(function (p) { var a = C.byId(L.accounts, p.accountId); if (p.kind === 'payment' && a && a.term !== 'long' && C.plannedIncluded(p, opts) && p.budgetMonth > lastShort) lastShort = p.budgetMonth; });
    if (!lastShort) return null;
    var start = C.addMonths(lastShort, 1), last = C.lastPlanMonth(L), rows = [], cum = 0;

  };

<script>
/* Statistics (Wallet-like): Balance, Spending, Cash flow, Outlook, Credit, Reports/Income */
(function () {
  'use strict';
  var App = window.App, C = App.C, I = App.I, CH = App.CH, S = App.S, T = App.T, F = App.F, esc = App.esc, kpi = App.kpi, kv = App.kv;
  function range() { var st = S.ui.stats; return C.periodRange(st.period, S.today, { from: st.from, to: st.to }); }
  function filt() { return { accounts: S.ui.stats.accounts, categories: S.ui.stats.categories }; }
  function buckets(from, to) {
    var days = C.diffDays(from, to) + 1, out = [];
    if (days <= 14) { for (var d = from; d <= to; d = C.addDays(d, 1)) out.push({ from: d, to: d, label: d.slice(8, 10) }); }
    else if (days <= 130) { for (var w = from; w <= to; w = C.addDays(w, 7)) { var e = C.addDays(w, 6); out.push({ from: w, to: e > to ? to : e, label: App.fd(w, false) }); } }
    else { for (var ym = from.slice(0, 7); ym <= to.slice(0, 7); ym = C.addMonths(ym, 1)) out.push({ from: ym + '-01' < from ? from : ym + '-01', to: C.lastDay(ym) > to ? to : C.lastDay(ym), label: App.fymShort(ym) }); }
    return out;
  }
  function filtersHtml() {
