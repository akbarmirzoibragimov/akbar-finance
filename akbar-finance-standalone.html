      h += '<div class="card"><div class="card-h"><span class="t">' + T('Сценарный анализ', 'Scenario analysis') + '</span><button class="more" data-a="go" data-s="simulator">' + T('Симулятор', 'Simulator') + I('chev', 'sm') + '</button></div><div class="tbl-wrap"><table class="tbl"><tr><th></th>' + L.scenarios.map(function (s) { return '<th class="r">' + esc(s.name[App.lang()] || s.name.ru) + '</th>'; }).join('') + '</tr><tr><td>' + T('Доход', 'Income') + '</td>' + L.scenarios.map(function (s) { return '<td class="r num">' + esc(F(s.income, 'AED', { dec: 0 })) + '</td>'; }).join('') + '</tr><tr><td>' + T('Остаток/мес', 'Monthly') + '</td>' + L.scenarios.map(function (s) { var x = C.scenarioCalc(s); return '<td class="r num ' + (x.monthly < 0 ? 'neg' : 'pos') + '">' + esc(F(x.monthly, 'AED', { dec: 0 })) + '</td>'; }).join('') + '</tr><tr><td>' + T('За 5 мес.', '5 months') + '</td>' + L.scenarios.map(function (s) { var x = C.scenarioCalc(s); return '<td class="r num ' + (x.total < 0 ? 'neg' : 'pos') + '">' + esc(F(x.total, 'AED', { dec: 0 })) + '</td>'; }).join('') + '</tr></table></div></div>';
    } else if (k === 'credit') {
      var ds = C.debtSummary(L, S.today), bal = C.balances(L);
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Структура задолженности', 'Debt structure') + '</span></div>' + CH.donut({ id: 'scDon', items: ds.rows.map(function (x) { return { label: x.acc.name, v: C.toBase(L, x.debt, x.acc.currency) || 0, color: x.acc.color }; }), center: F(ds.total), centerLabel: T('долг', 'debt'), fmtTip: fT }) + ds.rows.map(function (x) { return kv(x.acc.name, F(x.debt, x.acc.currency) + ' · ' + App.pct(ds.total ? (C.toBase(L, x.debt, x.acc.currency) || 0) / ds.total : 0, 1)); }).join('') + kv(T('Итого', 'Total'), '<b>' + esc(F(ds.total)) + '</b>', true) + kv(T('Краткосрочная (без долгосрочных)', 'Short-term (excl. long-term)'), F(ds.short)) + '</div>';
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Использование кредитных лимитов', 'Credit utilization') + '</span></div>' + L.accounts.filter(function (a) { return a.type === 'credit_card'; }).map(function (a) { var ci = C.creditInfo(L, a, bal, S.today); return '<div class="mt12"><div class="split small"><span class="b">' + esc(a.name) + '</span><span class="num">' + App.pct(ci.utilization, 2) + '</span></div><div class="bar mt8"><i style="width:' + Math.min(100, (ci.utilization || 0) * 100) + '%;background:' + (ci.overLimit ? 'var(--expense)' : 'var(--accent)') + '"></i></div><div class="tiny muted mt8">' + T('долг ', 'debt ') + esc(F(ci.debt, a.currency)) + ' · ' + T('лимит ', 'limit ') + esc(F(ci.limit, a.currency)) + ' · ' + T('доступно ', 'available ') + esc(F(ci.available, a.currency)) + (ci.overLimit ? ' · <span class="neg">' + T('превышение ', 'over ') + esc(F(ci.overLimit, a.currency)) + '</span>' : '') + '</div></div>'; }).join('') + '</div>';
      h += '<div class="card"><div class="card-h"><span class="t">' + T('График погашения долгов', 'Debt repayment schedule') + '</span></div>' + CH.line({ id: 'scProj', series: ds.rows.filter(function (x) { return x.debt > 0; }).map(function (x) { var cur = x.debt, pts = [{ x: S.today, y: cur }]; L.planned.filter(function (q) { return q.accountId === x.acc.id && q.kind === 'payment' && !q.scenario && q.date >= S.today; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (q) { var st = C.plannedState(L, q, S.today); if (!st.open) return; cur -= q.interestPart ? st.remaining - Math.round(st.remaining * q.interestPart / q.amount) : st.remaining; pts.push({ x: q.date, y: Math.max(0, cur) }); }); return { name: x.acc.name, color: x.acc.color, dashed: true, points: pts }; }), fmtTip: fT, fmtX: function (d) { return App.fymShort(d.slice(0, 7)); } }) + '</div>';
      var fl2 = C.flows(L, r.from, r.to, f);
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Проценты и комиссии', 'Interest & fees') + '</span></div>' + kv(T('Фактически за период', 'Actual in period'), F(fl2.finance)) + kv(T('Будущие (расчётно, где известно разделение)', 'Future (estimated, where split is known)'), F(C.sum(ds.rows, function (x) { return x.plannedInterest; }))) + '<div class="tiny unconf mt8">' + T('Где ставки и комиссии не подтверждены, проценты не рассчитываются.', 'Where rates and fees are unconfirmed, interest is not computed.') + '</div></div>';
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Оставшийся срок', 'Remaining term') + '</span></div>' + ds.rows.map(function (x) { var cd = x.closeDate; return kv(x.acc.name, cd === 'done' ? T('погашен', 'paid off') : cd ? App.fd(cd, true) + ' · ' + Math.max(0, Math.round(C.diffDays(S.today, cd) / 30.4)) + T(' мес.', ' mo') : '<span class="unconf">' + T('нет полного плана', 'no full plan') + '</span>', true); }).join('') + '</div>';
    } else if (k === 'income') {
      var fl3 = C.flows(L, r.from, r.to, f), bySrc = {};
      fl3.txs.forEach(function (t) { if (['salary', 'income', 'debt_return'].indexOf(t.type) < 0) return; var key = t.categoryId || t.type; bySrc[key] = (bySrc[key] || 0) + (C.toBase(L, t.amount, C.txCurrency(L, t)) || 0); });
      var srcKeys = Object.keys(bySrc);
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Источники дохода за период', 'Income sources in period') + '</span></div>' + (srcKeys.length ? CH.donut({ id: 'siDon', items: srcKeys.map(function (k2) { var c = App.cat(k2); return { label: App.catName(c), v: bySrc[k2], color: c ? c.color : '#30D158' }; }), center: F(fl3.earned + fl3.returnFunds), centerLabel: T('поступило', 'received'), fmtTip: fT }) + srcKeys.map(function (k2) { return kv(App.catName(k2) + (k2 === 'debt_return' ? T(' (не заработок)', ' (not earned)') : ''), F(bySrc[k2])); }).join('') : '<div class="empty">' + T('Фактических поступлений за период нет. Подтвердите зарплату в Income Plan.', 'No actual income in period. Confirm salary in Income Plan.') + '</div>') + '</div>';
      var incs = L.planned.filter(function (q) { return q.kind === 'income' && !q.scenario; }).sort(function (a, b) { return a.budgetMonth < b.budgetMonth ? -1 : 1; });
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Плановые и фактические поступления', 'Planned vs actual income') + '</span></div>' + CH.bars({ id: 'siBars', groups: incs.map(function (q) { return { label: App.fymShort(q.budgetMonth), tip: App.fym(q.budgetMonth), values: [{ v: q.amount, color: 'var(--income)', planned: true, name: T('план', 'plan') }, { v: C.plannedState(L, q, S.today).paid, color: 'var(--income)', name: T('факт', 'actual') }] }; }), fmtTip: fT, legend: [{ name: T('План', 'Plan'), color: 'var(--income)', planned: true }, { name: T('Факт', 'Actual'), color: 'var(--income)' }] }) + '</div>';
      var months = []; for (var ym = L.meta.asOf.slice(0, 7); ym <= C.ymOf(S.today); ym = C.addMonths(ym, 1)) months.push(ym);
      h += '<div class="card"><div class="card-h"><span class="t">' + T('Динамика доходов (факт)', 'Income dynamics (actual)') + '</span></div>' + CH.bars({ id: 'siDyn', groups: months.map(function (ym) { var x = C.flows(L, ym + '-01', C.lastDay(ym)); return { label: App.fymShort(ym), values: [{ v: x.earned, color: 'var(--income)', name: T('заработано', 'earned') }, { v: x.returnFunds, color: '#66D4CF', name: T('возврат долгов', 'returned') }] }; }), fmtTip: fT }) + '</div>';
      var extra = fl3.txs.filter(function (t) { return t.type === 'income' && (t.categoryId === 'extra' || t.projectId); });
      h += '<div class="sec-h"><span class="t">' + T('Дополнительный заработок', 'Side income') + '</span><span class="num pos">' + esc(F(C.sum(extra, function (t) { return C.toBase(L, t.amount, C.txCurrency(L, t)) || 0; }))) + '</span></div>' + (extra.length ? '<div class="list">' + extra.map(function (t) { return App.txRow(t); }).join('') + '</div>' : '<div class="card empty">' + T('Пока нет. Не включается в базовый прогноз до фактического получения.', 'None yet. Not included in the base forecast until received.') + '</div>');
    }
    return { title: titles[k] || T('Статистика', 'Statistics'), html: h };
  };
})();

</script>
<script>
/* More: hub, purchase check, simulator, health, business, assistant, change log, currencies, categories, data, settings, about */
(function () {
  'use strict';
  var App = window.App, C = App.C, I = App.I, CH = App.CH, S = App.S, T = App.T, F = App.F, esc = App.esc, kpi = App.kpi, kv = App.kv;
  function row(icon, color, title, sub, attrs, right) {
    return '<button class="row tap" ' + attrs + '><span class="cat-ic sq" style="background:' + color + '">' + I(icon) + '</span><div class="main-t"><div class="t1">' + title + '</div>' + (sub ? '<div class="t2">' + sub + '</div>' : '') + '</div>' + (right || '') + '<span class="chev">' + I('chev', 'sm') + '</span></button>';
  }
  function go(s) { return 'data-a="go" data-s="' + s + '"'; }

  App.screens.more = function () {
    var L = S.L, bc = App.badgeCount(), h = '';
    h += '<div class="card profile"><span class="logo-lg">' + I('wallet') + '</span><div class="grow"><div class="b">' + esc(L.meta.name) + '</div><div class="small muted">' + T('Локальная книга · ', 'Local ledger · ') + esc(AFDB.mode()) + '</div></div></div>';
    h += '<div class="list">' +
      row('bell', '#FF453A', T('Уведомления', 'Notifications'), '', go('notifications'), bc ? '<span class="badge-in">' + bc + '</span>' : '') +
      row('log', '#0A84FF', T('Все записи', 'All records'), L.transactions.filter(function (t) { return t.status !== 'void'; }).length + T(' записей', ' records'), go('records')) +
      row('bank', '#30D158', T('Счета', 'Accounts'), L.accounts.length + T(' счетов', ' accounts'), go('accounts')) + '</div>';
    h += '<div class="gh">' + T('Инструменты', 'Tools') + '</div><div class="list">' +
      row('scale', '#FF9F0A', T('Могу ли я себе это позволить?', 'Can I afford it?'), T('Проверка покупки', 'Purchase check'), go('purchase')) +
      row('chat', '#5E5CE6', T('Финансовый помощник', 'Financial assistant'), T('На правилах, не ИИ', 'Rule-based, not AI'), go('assistant')) +
      row('pulse', '#FF375F', T('Финансовое здоровье', 'Financial health'), String(C.healthScore(L, S.today).score) + ' / 100', go('health')) +
      row('flag', '#BF5AF2', T('Сценарный симулятор', 'Scenario simulator'), '', go('simulator')) +
      row('briefcase', '#AC8E68', T('Бизнес и инвестиции', 'Business & investments'), (L.projects || []).length + T(' проектов · ', ' projects · ') + (L.assets || []).length + T(' активов', ' assets'), go('business')) +
      row('calendar', '#64D2FF', T('Итоги месяца', 'Month review'), T('Сверка на конец месяца', 'Month-end reconciliation'), 'data-a="modal" data-m="review"') + '</div>';
    h += '<div class="gh">' + T('Настройки', 'Settings') + '</div><div class="list">' +
      row('dots', '#FF9F0A', T('Категории', 'Categories'), '', go('categories')) +
      row('coins', '#30D158', T('Валюты и курсы', 'Currencies & rates'), Object.keys(L.rates).join(', '), go('currencies')) +
      row('download', '#0A84FF', T('Данные, импорт и резервные копии', 'Data, import & backups'), T('JSON, CSV, снимки', 'JSON, CSV, snapshots'), go('data')) +
      row('edit', '#8E8E93', T('Журнал изменений', 'Change log'), (L.changelog || []).length + T(' записей', ' entries'), go('changelog')) +
      row('settings', '#8E8E93', T('Настройки', 'Settings'), (App.lang() === 'en' ? 'English' : 'Русский') + ' · ' + T({ dark: 'тёмная', light: 'светлая', auto: 'авто' }[L.settings.theme] || 'тёмная', L.settings.theme), go('settings')) +
      row('info', '#8E8E93', T('О приложении и ограничения', 'About & limitations'), 'Akbar Finance 3.0 · v3.1', go('about')) + '</div>';
    return { title: T('Ещё', 'More'), html: h };
  };

  /* ---------- purchase check ---------- */
  function pcResult() {
    var q = S.ui.pc, amt = App.toMinor(q.amount);
    if (!amt || amt <= 0) return '<div class="card empty">' + T('Введите сумму покупки', 'Enter the purchase amount') + '</div>';
    var r = C.purchaseCheck(S.L, { amount: amt, categoryId: q.categoryId, accountId: q.accountId, essential: q.essential }, S.today);
    var V = { ok: ['ok', 'check', T('Покупка допустима', 'Purchase is fine')], risk: ['warn', 'alert', T('Покупка рискованна', 'Purchase is risky')], violates: ['danger', 'close', T('Покупка нарушает финансовый план', 'Purchase breaks the financial plan')] }[r.verdict];
    var FL = { insufficient: T('На выбранном счёте недостаточно средств', 'Not enough money on the selected account'), obligations: T('После покупки собственных денег не хватит на обязательства ближайших дней', 'After the purchase own money will not cover upcoming obligations'), cashGap: T('Появится или углубится кассовый разрыв в ближайшие 45 дней', 'A cash gap appears or deepens within 45 days'), overLimit: T('Сумма превышает доступный кредитный лимит', 'Amount exceeds available credit'), family: T('Под угрозой плановые переводы родителям', 'Planned transfers to parents are at risk'), reserve: T('Придётся тронуть резерв', 'The reserve would be touched'), budget: T('Будет превышен личный бюджет месяца', 'Monthly personal budget would be exceeded'), categoryBudget: T('Будет превышен лимит категории', 'Category limit would be exceeded'), big: T('Несущественная покупка дороже 200 AED — подумайте 24 часа', 'Non-essential purchase over 200 AED — wait 24 hours'), creditNotReserve: T('Кредитный лимит — это долг, а не резерв', 'Credit limit is debt, not a reserve') };
    var h = '<div class="alert ' + V[0] + ' big">' + I(V[1]) + '<div class="grow b">' + V[2] + '</div></div>';
    h += r.flags.map(function (f) { return '<div class="small mt8">• ' + esc(FL[f] || f) + '</div>'; }).join('');
    h += '<div class="card mt12">' + (r.viaCredit ? kv(T('Долг после покупки', 'Debt after purchase'), F(r.debtAfter)) + kv(T('Доступный лимит после', 'Available credit after'), F(r.creditAvailableAfter)) : kv(T('Остаток на счёте после', 'Account balance after'), F(r.accountAfter))) +
      kv(T('Свободные деньги после обязательств', 'Free money after obligations'), F(r.freeAfter)) +
      kv(T('Остаток личного бюджета', 'Personal budget left'), F(r.budgetRemainingAfter)) +
      (r.categoryRemainingAfter != null ? kv(T('Остаток лимита категории', 'Category limit left'), F(r.categoryRemainingAfter)) : '') +
      kv(T('Минимум прогноза 45 дней', '45-day forecast low'), F(r.forecastMinAfter)) + kv(T('Обязательства горизонта', 'Obligations in horizon'), F(r.obligations)) + '</div>';
    return h;
  }
  App.screens.purchase = function () {
    var q = S.ui.pc, h = '<div class="form"><div class="group">' +
      App.fld(T('Сумма, AED', 'Amount, AED'), '<input class="in" inputmode="decimal" data-live="pc" data-k="amount" value="' + esc(q.amount) + '" placeholder="0">') +
      App.fld(T('Категория', 'Category'), '<select class="in" data-live="pc" data-k="categoryId">' + App.catOpts('expense', q.categoryId) + '</select>') +
      App.fld(T('Счёт', 'Account'), '<select class="in" data-live="pc" data-k="accountId">' + App.accOpts(null, q.accountId, T('Любой собственный', 'Any own money')) + '</select>') +
      App.fld(T('Необходимая покупка', 'Essential'), '<input type="checkbox" class="sw" data-live="pc" data-k="essential"' + (q.essential ? ' checked' : '') + '>') +
      '</div></div><div id="pcOut" class="mt12">' + pcResult() + '</div>';
    h += '<div class="note">' + T('Проверка учитывает баланс счёта, обязательства, личный бюджет и лимит категории, кассовые разрывы, переводы родителям и резерв. Кредитный лимит не считается собственными деньгами.', 'Checks account balance, obligations, personal budget and category limit, cash gaps, transfers to parents and reserve. Credit limits are not counted as own money.') + '</div>';
    return { title: T('Проверка покупки', 'Purchase check'), html: h };
  };
  App.live.pc = function (el) { S.ui.pc[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; var o = document.getElementById('pcOut'); if (o) o.innerHTML = pcResult(); };
  document.addEventListener('change', function (e) { var el = e.target; if (el.dataset && el.dataset.live === 'pc' && (el.tagName === 'SELECT' || el.type === 'checkbox')) App.live.pc(el); });

  /* ---------- simulator ---------- */
  function SIMF() { return [['income', T('Доход в месяц', 'Monthly income')], ['parents', T('Родителям', 'Parents')], ['loans', T('Кредиты', 'Loans')], ['expenses', T('Личные расходы', 'Personal spending')], ['savings', T('Сбережения', 'Savings')], ['other', T('Прочие обязательства', 'Other obligations')]]; }
  function simInit(id) { var s = C.byId(S.L.scenarios, id) || S.L.scenarios[1] || S.L.scenarios[0]; S.ui.sim = { id: s.id, income: App.amtStr(s.income), parents: App.amtStr(s.parents), loans: App.amtStr(s.loans), expenses: App.amtStr(s.expenses), savings: App.amtStr(s.savings || 0), other: App.amtStr(s.other || 0), months: String(s.months || 5) }; }
  function simObj() { var u = S.ui.sim, o = { months: Math.max(1, Math.min(60, parseInt(u.months, 10) || 5)) }; ['income', 'parents', 'loans', 'expenses', 'savings', 'other'].forEach(function (k) { o[k] = App.toMinor(u[k] || '0') || 0; }); return o; }
  function simOut() {
    var o = simObj(), r = C.scenarioCalc(o);
    return '<div class="kpis">' + kpi(T('Остаток в месяц', 'Monthly result'), App.FS(r.monthly), r.monthly < 0 ? 'neg' : 'pos') + kpi(T('За ', 'Over ') + o.months + T(' мес.', ' mo'), App.FS(r.total), r.total < 0 ? 'neg' : 'pos', T('с учётом сбережений ', 'incl. savings ') + F(r.savedTotal)) + '</div>' +
      '<div class="card mt12">' + CH.bars({ id: 'simBars', groups: r.rows.map(function (x) { return { label: String(x.n), tip: T('Месяц ', 'Month ') + x.n, values: [{ v: x.free, color: x.free < 0 ? 'var(--expense)' : 'var(--income)', planned: true, name: T('свободно накопительно', 'free cumulative') }, { v: x.cumulative, color: 'var(--savings)', planned: true, name: T('с накоплениями', 'with savings') }] }; }), fmtTip: function (v) { return F(v); } }) + '</div>';
  }
  App.screens.simulator = function () {
    if (!S.ui.sim) simInit('base');
    var u = S.ui.sim, h = '<div class="seg">' + S.L.scenarios.map(function (s) { return '<button class="' + (u.id === s.id ? 'on' : '') + '" data-a="simPreset" data-id="' + s.id + '">' + esc(s.name[App.lang()] || s.name.ru) + '</button>'; }).join('') + '</div>';
    h += '<div class="form mt12"><div class="group">' + SIMF().map(function (x) { return App.fld(x[1] + ', AED', '<input class="in" inputmode="decimal" data-live="sim" data-k="' + x[0] + '" value="' + esc(u[x[0]]) + '">'); }).join('') + App.fld(T('Месяцев', 'Months'), '<input class="in" inputmode="numeric" data-live="sim" data-k="months" value="' + esc(u.months) + '">') + '</div></div>';
    h += '<div id="simOut" class="mt12">' + simOut() + '</div>';
    h += '<div class="btns"><button class="btn sec" data-a="simSave">' + T('Сохранить сценарий', 'Save scenario') + '</button><button class="btn" data-a="simApply">' + T('Применить бюджет к плану', 'Apply budget to plan') + '</button></div>';
    h += '<div class="note">' + T('Симулятор не меняет фактические операции. «Применить» меняет только общий личный бюджет месяца (после подтверждения).', 'The simulator never changes actual records. "Apply" only changes the monthly personal budget (after confirmation).') + '</div>';
    return { title: T('Симулятор', 'Simulator'), html: h };
  };
  App.live.sim = function (el) { S.ui.sim[el.dataset.k] = el.value; var o = document.getElementById('simOut'); if (o) o.innerHTML = simOut(); };
  App.actions.simPreset = function (el) { simInit(el.dataset.id); App.render(); };
  App.actions.simSave = function () { var u = S.ui.sim, o = simObj(); App.commit(T('Сценарий сохранён', 'Scenario saved'), function (L) { var s = C.byId(L.scenarios, u.id); Object.assign(s, o); }); };
  App.actions.simApply = function () { var o = simObj(); App.confirm(T('Применить к плану?', 'Apply to plan?'), T('Общий личный бюджет месяца станет ', 'The monthly personal budget becomes ') + F(o.expenses) + T('. Фактические операции не изменятся.', '. Actual records stay unchanged.'), function () { App.commit(T('Личный бюджет обновлён', 'Personal budget updated'), function (L) { L.budgetPlan.total = o.expenses; }); }); };

      App.fld(T('Горизонт обязательств, дней', 'Obligations horizon, days'), '<input class="in" inputmode="numeric" data-ch="setNum" data-k="obligationsHorizonDays" value="' + (st.obligationsHorizonDays || 30) + '">') +
      App.fld(T('Напоминать о платежах за, дней', 'Remind about payments, days ahead'), '<input class="in" inputmode="numeric" data-ch="setNum" data-k="upcomingDays" value="' + (st.upcomingDays || 7) + '">') +
      App.fld(T('Личный бюджет в месяц, AED', 'Personal budget per month, AED'), '<input class="in" inputmode="decimal" data-ch="setBudget" value="' + App.amtStr(L.budgetPlan.total) + '">') +
      '</div><div class="note">' + T('Свободные деньги = собственные деньги (без резерва и накоплений) минус обязательства в пределах горизонта.', 'Free money = own money (excluding reserve and savings) minus obligations within the horizon.') + '</div></div>';
    h += '<div class="list mt12">' + row('info', '#8E8E93', T('Уведомления', 'Notifications'), T('Только внутри приложения: push-уведомления не используются', 'In-app only: push notifications are not used'), go('notifications')) + '</div>';
    return { title: T('Настройки', 'Settings'), html: h };
  };
  App.actions.setLang = function (el) { App.prefs.lang = el.value; App.savePrefs(); App.commit(el.value === 'en' ? 'Language: English' : 'Язык: русский', function (L) { L.settings.lang = el.value; }, { silent: true }); };
  App.actions.setTheme = function (el) { App.prefs.theme = el.value; App.savePrefs(); App.commit(T('Тема изменена', 'Theme changed'), function (L) { L.settings.theme = el.value; }, { silent: true }); };
  App.actions.setName = function (el) { var v = el.value.trim(); if (!v) return; App.commit(T('Название книги изменено', 'Ledger renamed'), function (L) { L.meta.name = v; }, { silent: true }); };
  App.actions.setNum = function (el) { var v = parseInt(el.value, 10); if (!(v >= 1 && v <= 365)) { App.toast(T('Введите от 1 до 365', 'Enter 1–365')); App.render(); return; } App.commit(T('Настройка сохранена', 'Setting saved'), function (L) { L.settings[el.dataset.k] = v; }, { silent: true }); };
  App.actions.setBudget = function (el) { var v = App.toMinor(el.value); if (v == null || v < 0) { App.render(); return; } App.commit(T('Личный бюджет обновлён', 'Personal budget updated'), function (L) { L.budgetPlan.total = v; }); };

  /* ---------- about & limitations ---------- */
  App.screens.about = function () {
    var li = function (a) { return '<li>' + a + '</li>'; };
    var h = '<div class="card"><div class="b">Akbar Finance 3.0 · v3.1</div><div class="small muted mt8">' + T('Личное приложение учёта финансов. Интерфейс вдохновлён структурой Wallet by BudgetBakers, собственная реализация без чужих логотипов и ресурсов.', 'Personal finance ledger. Interface inspired by the Wallet by BudgetBakers layout; own implementation, no third-party logos or assets.') + '</div></div>';
    h += '<div class="card"><div class="card-h"><span class="t">' + T('Честные ограничения', 'Honest limitations') + '</span></div><ul class="small ul">' +
      li(T('Нет облачной синхронизации и аккаунтов. Данные — только в этом браузере на этом устройстве.', 'No cloud sync or accounts. Data stays in this browser on this device.')) +
      li(T('Перенос между iPhone и Windows — вручную через экспорт/импорт JSON.', 'Moving between iPhone and Windows is manual via JSON export/import.')) +
      li(T('Нет подключения к банкам: все операции вводятся вручную.', 'No bank connections: all records are entered manually.')) +
      li(T('Уведомления только внутри приложения; push-уведомлений нет.', 'In-app notifications only; no push.')) +
      li(T('Помощник работает по правилам, это не ИИ.', 'The assistant is rule-based, not AI.')) +
      li(T('Курсы валют и цены активов вводятся вручную.', 'Currency rates and asset prices are entered manually.')) +
      li(T('Неподтверждённые ставки по кредитам не используются для начисления процентов; расчётные ставки явно помечены как оценка.', 'Unconfirmed loan rates are never used to accrue interest; estimated rates are clearly marked as estimates.')) +
      li(T('Safari может удалить данные сайта, если им долго не пользоваться (особенно при открытии не с экрана «Домой») — регулярно делайте резервную копию.', 'Safari may evict site data after long inactivity (especially when not opened from the Home Screen) — back up regularly.')) +
      li(T('Офлайн-режим (service worker) работает только при открытии по http(s); у автономного HTML-файла офлайн-кэша нет, но он сам по себе не требует сети.', 'Offline mode (service worker) works only over http(s); the standalone HTML file has no offline cache but needs no network anyway.')) +
      '</ul></div>';
    h += '<div class="small muted center">' + T('Хранилище: ', 'Storage: ') + esc(AFDB.mode()) + ' · ' + (window.AF_STANDALONE ? T('автономный файл', 'standalone file') : location.protocol.replace(':', '')) + '</div>';
    return { title: T('О приложении', 'About'), html: h };
  };
})();

</script>
<script>
/* Akbar Finance 3.1 — v3 dashboard (Личное/Бизнес, All finance ring, debt ring), income year plan, personal budget sweep,
   credit/card create & close flow, rates editor, goal templates, expense summaries. Loaded after the 3.0 screens. */
(function () {
  'use strict';
  var App = window.App, C = App.C, I = App.I, CH = App.CH, S = App.S, T = App.T, F = App.F, esc = App.esc;
  var ACC_COLORS = ['#0A84FF', '#30D158', '#FF9F0A', '#FF453A', '#BF5AF2', '#64D2FF', '#FF375F', '#5E5CE6', '#12A07A', '#E5484D', '#AC8E68', '#8E8E93'];

  /* ---------- spaces ---------- */
  App.space = function () { return App.prefs.space === 'business' ? 'business' : 'personal'; };
  App.V = function () { return C.spaceView(S.L, App.space()); };
  App.actions.setSpace = function (el) { App.prefs.space = el.dataset.v; App.savePrefs(); App.render(); };
  App.spaceSeg = function () {
    return '<div class="seg space-seg"><button class="' + (App.space() === 'personal' ? 'on' : '') + '" data-a="setSpace" data-v="personal">' + T('Личное', 'Personal') + '</button><button class="' + (App.space() === 'business' ? 'on' : '') + '" data-a="setSpace" data-v="business">' + T('Бизнес', 'Business') + '</button></div>';
  };

  /* ---------- collapsible sections ---------- */
  App.isCollapsed = function (k) { return !!(App.prefs.collapsed || {})[k]; };
  App.actions.secToggle = function (el) { var k = el.dataset.k; App.prefs.collapsed = App.prefs.collapsed || {}; App.prefs.collapsed[k] = !App.prefs.collapsed[k]; App.savePrefs(); App.render(); };
  function sec(k, title, body, right) {
    var col = App.isCollapsed(k);
    return '<section class="v3sec' + (col ? ' col' : '') + '"><div class="v3sec-h"><button class="v3sec-t" data-a="secToggle" data-k="' + k + '" aria-expanded="' + (!col) + '">' + I('down', 'sm') + '<span>' + esc(title) + '</span></button>' + (right || '') + '</div>' + (col ? '' : '<div class="v3sec-b">' + body + '</div>') + '</section>';
  }
  App.sec = sec;
  function more(screen, extra) { return '<button class="more" data-a="go" data-s="' + screen + '"' + (extra || '') + '>' + T('Все', 'All') + I('chev', 'sm') + '</button>'; }

  /* ---------- rates ---------- */
  App.uzsPerAed = function (L) { var r = (L || S.L).rates.UZS; return r ? 1 / r : null; };
  App.rateCaption = function (L) {
    L = L || S.L; var d = L.rateDates || {}, u = App.uzsPerAed(L), dt = d.UZS || d.USD;
    return T('курс на ', 'rate as of ') + (dt ? App.fd(dt, true) : '—') + T(', вручную', ', manual') + '<br>1&nbsp;USD = ' + esc(String(L.rates.USD || '—').replace('.', ',')) + '&nbsp;AED' + (u ? '<br>1&nbsp;AED = ' + esc(C.fmt(Math.round(u * 100), { lang: App.lang(), cur: 'UZS' })).replace(/\s/g, '&nbsp;') : '');
  };
  function conv(L, v, cur) { var x = C.convert(L, v, cur); return x == null ? '—' : F(x, cur, { dec: cur === 'UZS' ? 0 : 2 }); }

  /* ---------- context for academy & lessons (real numbers, computed at runtime) ---------- */
  App.finCtx = function () {
    var L = S.L, V = C.spaceView(L, 'personal'), m = C.metrics(V, S.today), ds = C.debtSummary(V, S.today);
    var nextYm = C.addMonths(C.ymOf(S.today), 1), mp = C.monthPlan(V, nextYm, { today: S.today });
    var ip = C.incomeMonth(L, nextYm), sal = ip.lines.filter(function (l) { return l.type === 'salary'; })[0];
    var salary = sal ? sal.exp : mp.income, low = sal ? sal.low : salary;
    var debtPay = 0; mp.items.forEach(function (it) { if (it.kind === 'payment') debtPay += -it.amount; });
    var bs = C.budgetStatus(V, C.ymOf(S.today), S.today);
    var f = function (v) { return F(v); };
    return { own: f(m.own), debt: f(ds.total), short: f(ds.short), long: f(ds.long), shortPct: App.pct(ds.total ? ds.short / ds.total : 0), netWorth: f(m.netWorth),
      salary: f(salary), salaryLow: f(low), s50: f(Math.round(salary * .5)), s30: f(Math.round(salary * .3)), s20: f(Math.round(salary * .2)),
      nextIncome: f(mp.income), nextOut: f(mp.out), nextResult: App.FS(mp.result), budget: f(L.budgetPlan.total || 0), budgetSpent: f(bs.total.spent),
      saved: f(m.reserved + m.savings), dti: App.pct(mp.income ? debtPay / mp.income : 0) };
  };
  App.fillCtx = function (s, ctx) { return String(s).replace(/\{(\w+)\}/g, function (m0, k) { return ctx[k] != null ? ctx[k] : m0; }); };

  /* active budget month: the current month while it still has open planned payments, otherwise the next one
     (end-of-month salary funds the next month) */
  App.activeBudgetMonth = function (V) {
    var ym = C.ymOf(S.today), open = V.planned.some(function (p) { return p.budgetMonth === ym && (p.kind === 'payment' || p.kind === 'family') && C.plannedIncluded(p) && C.plannedState(V, p, S.today).open; });
    return open ? ym : C.addMonths(ym, 1);
  };
  /* ---------- dashboard v3 ---------- */
  App.screens.home = function () {
    var L = S.L, V = App.V(), sp = App.space(), m = C.metrics(V, S.today), bal = m.balances;
    var h = App.spaceSeg();
    var own = V.accounts.filter(function (a) { return !C.isLiab(a) && !a.archived && !a.closed; });
    var liabs = V.accounts.filter(function (a) { return C.isLiab(a) && !a.archived && !a.closed; });
    if (sp === 'business' && !V.accounts.length) {
      h += '<div class="card v3empty">' + I('briefcase') + '<div class="b">' + T('Бизнес — отдельное пространство', 'Business is a separate space') + '</div><div class="small muted">' + T('Свои счета, записи и итоги. Личные деньги и долги сюда не попадают — и наоборот.', 'Its own accounts, records and totals. Personal money and debt stay out — and vice versa.') + '</div>' +
        '<button class="btn" data-a="modal" data-m="account" data-space="business">' + I('plus') + T('Создать бизнес-счёт', 'Create a business account') + '</button></div>';
      return { title: T('Главная', 'Dashboard'), html: h };
    }
    if (m.unconvertible.length) h += '<div class="alert warn">' + I('alert') + '<div class="grow">' + T('Нет курса для: ', 'No rate for: ') + esc(m.unconvertible.join(', ')) + '. <a href="#" data-a="go" data-s="currencies">' + T('Указать курс', 'Set rate') + '</a></div></div>';
    // 1. portfolio: All finance
    var pf = C.portfolio(V, S.today);
    var segs = pf.segments.map(function (s) { return { v: s.value, color: s.color, info: '<b>' + esc(s.name) + '</b> · ' + App.pct(s.pct) + '<br>' + esc(F(s.value)) + (pf.mode === 'debt' ? ' · ' + (s.term === 'long' ? T('долгосрочный', 'long-term') : T('краткосрочный', 'short-term')) : '') }; });
    var netCls = pf.net < 0 ? 'neg' : 'pos';
    var center = '<div><div class="rc-k">All finance</div><div class="rc-v num ' + netCls + '">' + esc(F(pf.net, 'AED', { dec: Math.abs(pf.net) >= 10000000 ? 0 : 2 }).replace(/\s?AED$/, '')) + '</div><div class="rc-u">AED</div></div>';
    h += '<div class="v3top"><div class="card v3pf"><div class="v3ring-row">' + CH.rings({ id: 'pfRing', size: 168, rings: [{ w: 16, items: segs.length ? segs : [{ v: 1, color: 'var(--card2)' }] }], centerHtml: center }) +
      '<div class="v3side"><div class="v3lbl">' + T('Общий баланс', 'Total balance') + '</div><div class="v3big num ' + netCls + '">' + esc(F(pf.net).replace(/\s?AED$/, '')) + ' <small>AED</small></div>' +
      '<div class="small muted num">≈ ' + esc(conv(V, pf.net, 'USD')) + '<br>≈ ' + esc(conv(V, pf.net, 'UZS')) + '</div>' +
      (pf.debt ? '<div class="small b mt8">' + T('Краткосрочные ', 'Short-term ') + App.pct(pf.shortPct) + '<br>' + T('Долгосрочные ', 'Long-term ') + App.pct(pf.longPct) + '</div>' : '') +
      '<button class="v3rate" data-a="go" data-s="currencies">' + App.rateCaption(V) + '</button></div></div>' +
      '<div id="pfRing-info" class="ring-info hidden"></div>' +
      '<div class="tiny muted mt8">' + (pf.mode === 'debt' ? T('Баланс отрицательный: кольцо показывает доли кредиторов в долге. Нажми на сегмент.', 'Balance is negative: the ring shows each creditor\'s share of debt. Tap a segment.') : T('Кольцо — доли счетов в собственных средствах. Нажми на сегмент.', 'The ring shows each account\'s share of own money. Tap a segment.')) + ' ' + T('Общий баланс = собственные средства − все долги.', 'Total balance = own money − all debt.') + '</div>' +
      '<div class="v3legend">' + pf.segments.map(function (s) { return '<div class="leg"><i style="background:' + s.color + '"></i><span class="leg-n ellipsis">' + esc(s.name) + '</span><span class="leg-p num">' + App.pct(s.pct) + '</span><span class="leg-v num">' + esc(F(s.value)) + '</span></div>'; }).join('') + '</div></div>';
    // 2. debt ring
    var dr = C.debtRing(V, S.today);
    if (dr.total > 0) {
      var outer = [{ v: dr.short, color: '#FF9F0A', pctLabel: App.pct(dr.shortPct), info: '<b>' + T('Краткосрочные', 'Short-term') + '</b> · ' + App.pct(dr.shortPct) + '<br>' + esc(F(dr.short)) }, { v: dr.long, color: '#FF453A', pctLabel: App.pct(dr.longPct), info: '<b>' + T('Долгосрочные', 'Long-term') + '</b> · ' + App.pct(dr.longPct) + '<br>' + esc(F(dr.long)) }];
      var inner = dr.inner.map(function (r) { return { v: r.value, color: r.color, info: '<b>' + esc(r.name) + '</b> · ' + App.pct(r.pct) + T(' долга', ' of debt') + '<br>' + T('Долг ', 'Debt ') + esc(F(r.value)) + '<br>' + (r.next ? T('Следующий платёж: ', 'Next payment: ') + esc(F(r.next.amount)) + T(' до ', ' by ') + esc(App.fd(r.next.date, true)) : T('Платёж не запланирован', 'No payment planned')) }; });
      var dc = '<div><div class="rc-k">' + T('100% долга', '100% of debt') + '</div><div class="rc-v num neg">' + esc(F(-dr.total, 'AED', { dec: 0 }).replace(/\s?AED$/, '')) + '</div><div class="rc-u">' + T('погашено ', 'repaid ') + App.pct(dr.repaidPct, 0) + '</div></div>';
      h += sec('debt', T('Долг', 'Debt'), '<div class="card v3debt"><div class="v3ring-row">' + CH.rings({ id: 'debtRing', size: 176, gap: 3, rings: [{ w: 20, items: outer, labels: true, labelSize: 10 }, { w: 12, items: inner }], centerHtml: dc }) +
        '<div class="v3boxes"><div class="box"><div class="p" style="color:#FF9F0A">' + App.pct(dr.shortPct) + '</div><div class="l">' + T('Краткосрочные', 'Short-term') + '<br><span class="num">' + esc(F(dr.short)) + '</span></div></div><div class="box"><div class="p" style="color:#FF453A">' + App.pct(dr.longPct) + '</div><div class="l">' + T('Долгосрочные', 'Long-term') + '<br><span class="num">' + esc(F(dr.long)) + '</span></div></div></div></div>' +
        '<div id="debtRing-info" class="ring-info hidden"></div><div class="tiny muted mt8">' + T('Внешнее кольцо — краткосрочные и долгосрочные (100%). Внутреннее — кредиторы. Нажми на сегмент: сумма и следующий платёж.', 'Outer ring: short vs long-term (100%). Inner ring: creditors. Tap a segment for amount and next payment.') + '</div></div>',
        '<button class="more" data-a="go" data-s="debts">Debt Freedom' + I('chev', 'sm') + '</button>');
    }
    h += '</div>';
    // warnings (top 2)
    var notes = C.notifications(V, S.today).filter(function (n) { return !n.dismissed && (n.level === 'danger' || n.level === 'warn'); });
    if (notes.length) h += notes.slice(0, 2).map(App.noteHtml).join('') + (notes.length > 2 ? '<button class="linkbtn" data-a="go" data-s="notifications">' + T('Ещё предупреждения: ', 'More warnings: ') + (notes.length - 2) + '</button>' : '');
    // KPI strip
    var bym = App.activeBudgetMonth(V), mp = C.monthPlan(V, bym, { today: S.today, scenarios: S.ui.scen.reborrow ? ['reborrow'] : [] });
    h += '<div class="v3kpis">' + App.kpi(T('Собственные средства', 'Own money'), F(m.own), m.own < 0 ? 'neg' : '') + App.kpi(T('Обязательства · ', 'Obligations · ') + App.fymShort(bym), F(-mp.out), 'neg') + App.kpi(T('Итог месяца по плану', 'Month result (plan)'), App.FS(mp.result), mp.result < 0 ? 'neg' : 'pos') + App.kpi(T('Чистый капитал', 'Net worth'), F(m.netWorth), m.netWorth < 0 ? 'neg' : 'pos') + '</div>';
    // quote of the day
    var q = C.quoteOfDay(S.today);
    if (!App.isCollapsed('quote')) h += '<div class="card v3quote"><span class="qmark">«</span><div class="grow"><p>' + esc(q.ru) + '</p><div class="who">' + esc(q.a) + '</div></div><button class="iconbtn sm" data-a="secToggle" data-k="quote" aria-label="hide">' + I('close', 'sm') + '</button></div>';
    // obligations of the budget month (personal budget included)
    if (sp === 'personal') h += sec('oblig', T('Обязательные · ', 'Obligations · ') + App.fym(bym).replace(/\s\d{4}$/, ''), obligations(V, mp, bym), more('monthplan'));
    // personal budget envelope & remainder → savings
    if (sp === 'personal' && (L.budgetPlan.total || 0) > 0) h += sec('budget', T('Личный бюджет', 'Personal budget'), budgetCard(V), more('budgets'));
    // charts
    h += sec('charts', T('Графики', 'Charts'), chartsCard(V, m));
    // accounts
    h += sec('accounts', T('Мои счета', 'My accounts'), '<div class="acc-grid">' + own.map(function (a) { return App.accTile(a, bal); }).join('') + '<button class="acc-tile add" data-a="modal" data-m="account" data-space="' + sp + '">' + I('plus', 'sm') + T('Счёт', 'Account') + '</button></div>', more('accounts'));
    h += sec('credits', T('Кредиты и карты', 'Loans & cards'), '<div class="acc-grid">' + liabs.map(function (a) { return App.accTile(a, bal); }).join('') + '<button class="acc-tile add" data-a="modal" data-m="newCredit" data-space="' + sp + '">' + I('plus', 'sm') + T('Кредит / карта', 'Loan / card') + '</button></div>', '<button class="more" data-a="go" data-s="debts">Debt Freedom' + I('chev', 'sm') + '</button>');
    // goals
    var goals = (V.goals || []).map(function (g) { return C.goalStatus(L, g, S.today); });
    h += sec('goals', T('Цели', 'Goals'), '<div class="v3goals">' + goals.slice(0, 6).map(goalCard).join('') + '<button class="gcard add" data-a="modal" data-m="goalTpl">' + I('plus') + '<span>' + T('Новая цель', 'New goal') + '</span></button></div>', more('goals'));
    // academy teaser
    if (sp === 'personal' && App.academyTeaser) h += App.academyTeaser();
    // upcoming & recent
    var up = C.upcoming(V, S.today, 21).slice(0, 6);
    h += sec('upcoming', T('Ближайшие 3 недели', 'Next 3 weeks'), '<div class="list">' + (up.length ? up.map(function (x) { return App.plannedRow(x.p, x.st); }).join('') : '<div class="empty">' + T('Платежей нет', 'Nothing due') + '</div>') + '</div>', more('planned'));
    var recent = App.sortTx(V.transactions).slice(0, 5);
    h += sec('recent', T('Последние записи', 'Last records'), recent.length ? '<div class="list">' + recent.map(function (t) { return App.txRow(t); }).join('') + '</div>' : '<div class="list"><div class="empty">' + T('Записей пока нет. Нажми «+», чтобы добавить.', 'No records yet. Tap “+”.') + '</div></div>', more('records'));
    return { title: T('Главная', 'Dashboard'), html: h };
  };

  function obligations(V, mp, ym) {
    var rows = mp.items.filter(function (it) { return it.amount < 0; }).map(function (it) {
      if (it.kind === 'personal') return '<div class="row"><span class="cat-ic" style="background:#FF9F0A">' + I('cart') + '</span><div class="main-t"><div class="t1">' + T('Личный бюджет', 'Personal budget') + '</div><div class="t2">' + T('потрачено ', 'spent ') + esc(F(it.actual)) + T(' · остаток в конце месяца → накопления (по подтверждению)', ' · month-end remainder → savings (on confirmation)') + '</div></div><div class="amt num">' + esc(F(it.amount)) + '</div></div>';
      if (it.kind === 'unplannedOut') return '<div class="row"><span class="cat-ic" style="background:#8E8E93">' + I('receipt') + '</span><div class="main-t"><div class="t1">' + T('Внеплановые платежи', 'Unplanned payments') + '</div></div><div class="amt num">' + esc(F(it.amount)) + '</div></div>';
      var a = it.accountId && App.acc(it.accountId);
      return '<button class="row tap" data-a="modal" data-m="editPlanned" data-id="' + it.id + '"><span class="cat-ic" style="background:' + (a ? a.color : it.kind === 'family' ? 'var(--savings)' : 'var(--planned)') + '">' + I(a ? a.icon || 'card' : it.kind === 'family' ? 'family' : 'calendar') + '</span><div class="main-t"><div class="t1">' + esc(it.title) + (it.scenario ? ' <span class="tag">' + T('сценарий', 'scenario') + '</span>' : '') + '</div><div class="t2">' + esc(App.fd(it.date)) + ' · ' + App.pTag(it.status) + '</div></div><div class="amt num">' + esc(F(it.amount)) + '</div></button>';
    });
    var inc = mp.items.filter(function (it) { return it.amount > 0 && it.kind !== 'unplannedIn'; });
    return '<div class="list">' + rows.join('') + '<div class="row total"><div class="main-t"><div class="t1">' + T('Итого обязательств', 'Total obligations') + '</div><div class="t2">' + T('поступления по плану ', 'planned inflows ') + esc(F(mp.income)) + (inc.some(function (i) { return i.kind === 'borrow'; }) ? T(' (включая займы — это не доход)', ' (incl. loans — not income)') : '') + '</div></div><div class="amt num neg">' + esc(F(-mp.out)) + '</div></div>' +
      '<div class="row total"><div class="main-t"><div class="t1">' + T('Остаток по плану', 'Planned remainder') + '</div></div><div class="amt num ' + (mp.result < 0 ? 'neg' : 'pos') + '">' + esc(App.FS(mp.result)) + '</div></div></div>';
  }

  function budgetCard(V) {
    var ym = C.ymOf(S.today), br = C.budgetRemainder(V, ym, S.today), prev = C.addMonths(ym, -1), bp = C.budgetRemainder(S.L, prev, S.today);
    var pct = br.limit ? Math.min(1, br.spent / br.limit) : 0, h = '<div class="card">';
    h += '<div class="split"><span class="small muted">' + esc(App.fym(ym)) + '</span><span class="num b">' + esc(F(br.spent)) + ' / ' + esc(F(br.limit)) + '</span></div><div class="bar mt8"><i style="width:' + pct * 100 + '%;background:' + (br.over ? 'var(--expense)' : 'var(--accent)') + '"></i></div>';
    h += '<div class="split mt8 small"><span class="muted">' + (br.over ? T('Перерасход', 'Over budget') : T('Осталось', 'Left')) + '</span><span class="num ' + (br.over ? 'neg' : 'pos') + '">' + esc(F(br.over || br.remainder)) + '</span></div>';
    var showSweep = function (r, label) { return '<div class="alert info mt8">' + I('piggy') + '<div class="grow">' + label + '</div><button class="act" data-a="modal" data-m="sweep" data-ym="' + r.ym + '">' + T('Перевести', 'Transfer') + '</button></div>'; };
    if (bp.limit && bp.ended && !bp.swept && bp.remainder > 0 && prev >= C.ymOf(S.L.meta.asOf || S.today)) h += showSweep(bp, T('Остаток бюджета за ', 'Budget remainder for ') + esc(App.fym(prev)) + ': ' + esc(F(bp.remainder)) + T(' → в накопления?', ' → to savings?'));
    if (br.swept) h += '<div class="tiny muted mt8">' + I('check', 'sm') + T(' Остаток переведён в накопления: ', ' Remainder moved to savings: ') + esc(F(br.sweptAmount)) + '</div>';
    else if (br.due && br.remainder > 0) h += showSweep(br, T('Конец месяца: остаток ', 'Month end: remainder ') + esc(F(br.remainder)) + T(' → в накопления?', ' → to savings?'));
    else h += '<div class="tiny muted mt8">' + T('В последние дни месяца здесь появится предложение перевести остаток в накопления. Перевод создаётся только после твоего подтверждения — автоматически приложение деньги не двигает.', 'In the last days of the month you will be offered to move the remainder to savings. The transfer is created only after you confirm — the app never moves money automatically.') + '</div>';
    return h + '</div>';
  }

  function goalCard(gs) {
    var g = gs.goal, st = C.goalStage(gs.pct);
    return '<button class="gcard" data-a="go" data-s="goals"><div class="gt ellipsis2">' + esc(g.title) + '</div><div class="gp num" style="color:' + (g.color || 'var(--accent)') + '">' + App.pct(gs.pct, 0) + '</div><div class="gs">' + esc(T(st.ru, st.en)) + '</div><div class="bar thin"><i style="width:' + Math.min(100, gs.pct * 100) + '%;background:' + (g.color || 'var(--accent)') + '"></i></div></button>';
  }

  function chartsCard(V, m) {
    var ym0 = C.ymOf(S.today), rows = C.planSeries(V, ym0, 6, { today: S.today, scenarios: S.ui.scen.reborrow ? ['reborrow'] : [] });
    var bars = CH.bars({ id: 'v3flow', height: 150, groups: rows.map(function (r) { return { label: App.fymShort(r.ym), tip: App.fym(r.ym) + ' · ' + T('итог ', 'result ') + App.FS(r.result), values: [{ v: r.income, color: 'var(--income)', name: T('Поступления', 'Inflows') }, { v: r.out, color: 'var(--expense)', name: T('Обязательства', 'Obligations') }] }; }),
      fmtTip: function (v) { return F(v); }, legend: [{ name: T('Поступления', 'Inflows'), color: 'var(--income)' }, { name: T('Обязательства', 'Obligations'), color: 'var(--expense)' }] });
    // debt & net worth projection by plan (no new events assumed)
    var proj = debtProjection(V, 12), pts = proj.map(function (p) { return { x: p.ym + '-01', y: -p.debt + m.own }; });
    var line = CH.line({ id: 'v3nw', height: 150, zero: true, series: [{ name: T('Общий баланс по плану', 'Total balance by plan'), color: 'var(--accent)', fill: true, points: pts }], fmtTip: function (v) { return F(v); }, fmtX: function (d) { return App.fymShort(d.slice(0, 7)); } });
    return '<div class="v3charts"><div class="card"><div class="card-h"><span class="t small">' + T('Денежный поток по бюджетным месяцам (план)', 'Cash flow by budget month (plan)') + '</span></div>' + bars + '</div>' +
      '<div class="card"><div class="card-h"><span class="t small">' + T('Общий баланс: прогноз по плану платежей', 'Total balance: projection by payment plan') + '</span></div>' + line + '<div class="tiny muted mt8">' + T('Долг уменьшается на плановые погашения тела и растёт на плановые займы. Собственные средства взяты на сегодня — без будущих накоплений. Это ориентир, а не факт.', 'Debt drops by planned principal repayments and grows by planned borrowing. Own money is today\'s — future savings not included. An estimate, not a fact.') + '</div></div></div>';
  }
  function debtProjection(V, n) {
    var ds = C.debtSummary(V, S.today), debt = ds.total, ym0 = C.ymOf(S.today), out = [], rows = V.planned.filter(function (p) { return C.plannedIncluded(p, { scenarios: S.ui.scen.reborrow ? ['reborrow'] : [] }); });
    for (var i = 0; i < n; i++) {
      var ym = C.addMonths(ym0, i);
      rows.forEach(function (p) {
        if (p.date.slice(0, 7) !== ym) return; var st = C.plannedState(V, p, S.today);
        var a = p.accountId && C.byId(V.accounts, p.accountId); if (!a || !C.isLiab(a)) return;
        if (p.kind === 'payment' && st.open) debt -= C.toBase(V, p.interestPart ? Math.round(st.remaining * (1 - p.interestPart / p.amount)) : st.remaining, p.currency) || 0;
        if (p.kind === 'borrow' && !p.confirmed) debt += C.toBase(V, p.debtAmount || p.amount, p.currency) || 0;
      });
      out.push({ ym: ym, debt: Math.max(0, debt) });
    }
    return out;
  }
  App.debtProjection = debtProjection;
})();

</script>
<script>
/* Akbar Finance 3.1 — credits/cards create & close, budget sweep, goal templates, income year plan, rates, expense summaries */
(function () {
  'use strict';
  var App = window.App, C = App.C, I = App.I, CH = App.CH, S = App.S, T = App.T, F = App.F, esc = App.esc;

  /* ---------- new credit / card (pick type → account modal) ---------- */
  App.modals.newCredit = function (m) {
    var h = '<div class="list">' + [['credit_card', 'card', T('Кредитная карта', 'Credit card'), T('Лимит, выписка, минимальный платёж, срок', 'Limit, statement, minimum payment, due date')], ['loan', 'loan', T('Кредит / заём / рассрочка', 'Loan / instalments'), T('Сумма долга, ежемесячный платёж, срок', 'Balance, monthly payment, end date')]].map(function (x) {
      return '<button class="row tap" data-a="newCreditPick" data-t="' + x[0] + '"><span class="cat-ic" style="background:var(--expense)">' + I(x[1]) + '</span><div class="main-t"><div class="t1">' + x[2] + '</div><div class="t2">' + x[3] + '</div></div>' + I('chev', 'sm') + '</button>';
    }).join('') + '</div><div class="dashed-note">' + T('Новый кредит добавляет долг в общий баланс. Если деньги по нему пришли на твой счёт — запиши отдельно «Получение кредита», это не доход.', 'A new loan adds debt to the total balance. If its money reached your account, also record “Loan received” — it is not income.') + '</div>';
    return { title: T('Новый кредит или карта', 'New loan or card'), html: h };
  };
  App.actions.newCreditPick = function (el) { var sp = S.modal.space; App.openModal('account', { type: el.dataset.t, space: sp }); };

  /* account modal: add space selector (personal/business) */
  var accModal = App.modals.account;
  App.modals.account = function (m) {
    var a = m.id ? App.acc(m.id) : null;
    if (!m.inited) m.f.space = a ? (a.space || 'personal') : (m.space || App.space());
    var out = accModal(m);
    var spSel = '<div class="form"><div class="group">' + App.fld(T('Пространство', 'Space'), '<select class="in" data-ch="accSpace">' + App.opts([['personal', T('Личное', 'Personal')], ['business', T('Бизнес', 'Business')]], m.f.space) + '</select>') + '</div></div>';
    out.html = out.html.replace('<div class="form">', spSel + '<div class="form">');
    return out;
  };
  App.actions.accSpace = function (el) { S.modal.f.space = el.value; };
  var saveAcc = App.actions.saveAccount;
  App.actions.saveAccount = function () {
    var m = S.modal, sp = m.f.space || 'personal', id = m.id, before = S.L.accounts.map(function (a) { return a.id; });
    saveAcc();
    var a = id ? App.acc(id) : S.L.accounts.filter(function (x) { return before.indexOf(x.id) < 0; })[0];
    if (a && (a.space || 'personal') !== sp) { a.space = sp; App.save(); App.render(); }
  };

  /* ---------- close / liquidate with confirmation (history is kept) ---------- */
  App.actions.accClose = function () {
    var id = S.modal.id, a = App.acc(id), bal = C.balances(S.L)[id] || 0, liab = C.isLiab(a);
    if (a.closed) { App.confirm(T('Открыть снова?', 'Reopen?'), T('Счёт «', 'Account “') + a.name + T('» снова появится в списках и расчётах.', '” will return to lists and totals.'), function () { App.commit(T('Счёт открыт снова', 'Account reopened'), function (L) { var x = C.byId(L.accounts, id); x.closed = false; x.closedAt = null; }); }); return; }
    App.openModal('closeAcc', { id: id, bal: bal, liab: liab });
  };
  App.modals.closeAcc = function (m) {
    var a = App.acc(m.id), bal = C.balances(S.L)[m.id] || 0, liab = C.isLiab(a), h = '<div class="card">';
    var open = S.L.planned.filter(function (p) { return (p.accountId === m.id || p.fromAccountId === m.id || p.toAccountId === m.id) && C.plannedState(S.L, p, S.today).open; });
    if (liab && bal > 0) {
      h += '<div class="alert danger">' + I('alert') + '<div class="grow">' + T('По «', '“') + esc(a.name) + T('» остаётся долг ', '” still has debt of ') + '<b class="num">' + esc(F(bal, a.currency)) + '</b>. ' + T('Банк не закроет кредит с долгом. Сначала запиши погашение, затем закрой.', 'A lender will not close a line with debt. Record the repayment first, then close.') + '</div></div>' +
        '<div class="btns"><button class="btn" data-a="modal" data-m="record" data-type="repayment" data-to="' + m.id + '">' + I('check') + T('Записать погашение', 'Record repayment') + '</button></div>';
    } else if (!liab && bal !== 0) {
      h += '<div class="alert warn">' + I('alert') + '<div class="grow">' + T('На счёте ещё ', 'The account still holds ') + '<b class="num">' + esc(F(bal, a.currency)) + '</b>. ' + T('Переведи остаток на другой счёт, чтобы деньги не «пропали» из баланса.', 'Move the remainder to another account so the money stays in your balance.') + '</div></div>' +
        '<div class="btns"><button class="btn" data-a="modal" data-m="record" data-type="transfer" data-from="' + m.id + '">' + I('swap') + T('Перевести остаток', 'Transfer remainder') + '</button></div>';
    } else {
      h += '<div>' + (liab ? T('Долг по «', 'Debt on “') + esc(a.name) + T('» равен нулю. Закрыть кредитную линию?', '” is zero. Close the credit line?') : T('Закрыть счёт «', 'Close account “') + esc(a.name) + '»?') + '</div>' +
        '<ul class="small muted"><li>' + T('Вся история операций сохранится и останется в отчётах.', 'All history stays and remains in reports.') + '</li><li>' + T('Счёт исчезнет из списков выбора и с главной.', 'It disappears from pickers and the dashboard.') + '</li><li>' + T('Его можно открыть снова в настройках счёта.', 'You can reopen it in account settings.') + '</li>' + (open.length ? '<li>' + T('Будущих плановых платежей: ', 'Open planned items: ') + open.length + T(' — они будут помечены как пропущенные.', ' — they will be marked skipped.') + '</li>' : '') + '</ul>' +
        '<div class="btns"><button class="btn sec" data-a="closeModal">' + T('Отмена', 'Cancel') + '</button><button class="btn danger" data-a="accCloseOk" data-id="' + m.id + '">' + (liab ? T('Закрыть кредит', 'Close credit') : T('Закрыть счёт', 'Close account')) + '</button></div>';
    }
    return { title: liab ? T('Закрыть / ликвидировать кредит', 'Close / liquidate credit') : T('Закрыть счёт', 'Close account'), html: h + '</div>' };
  };
  App.actions.accCloseOk = function (el) {
    var id = el.dataset.id; App.closeModal();
    App.commit(T('Счёт закрыт, история сохранена', 'Account closed, history kept'), function (L) {
      var a = C.byId(L.accounts, id); if (C.isLiab(a) && (C.balances(L)[id] || 0) > 0) return { ok: false };
      a.closed = true; a.closedAt = new Date().toISOString();
      L.planned.forEach(function (p) { if ((p.accountId === id || p.fromAccountId === id || p.toAccountId === id) && C.plannedState(L, p, S.today).open) p.status = 'skipped'; });
    });
  };

  /* ---------- personal budget remainder → savings (explicit confirmation) ---------- */
  App.modals.sweep = function (m) {
    var f = m.f, ym = m.ym, br = C.budgetRemainder(S.L, ym, S.today);
    if (!m.inited) { m.inited = true; var sav = S.L.accounts.filter(function (a) { return !a.closed && !a.archived && a.role === 'savings' && (a.space || 'personal') === 'personal'; })[0]; f.to = sav ? sav.id : ''; f.from = (S.L.accounts.filter(function (a) { return !a.closed && !C.isLiab(a) && !a.role && (a.space || 'personal') === 'personal'; })[0] || {}).id || ''; f.amount = App.amtStr(br.remainder); }
    var h = '<div class="card"><div class="split"><span>' + T('Бюджет ', 'Budget ') + esc(App.fym(ym)) + '</span><span class="num">' + esc(F(br.spent)) + ' / ' + esc(F(br.limit)) + '</span></div><div class="split mt8 b"><span>' + T('Остаток', 'Remainder') + '</span><span class="num pos">' + esc(F(br.remainder)) + '</span></div></div>' +
      '<div class="form"><div class="group">' + App.fld(T('Откуда', 'From'), '<select class="in" data-ch="fset" data-k="from">' + App.accOpts(function (a) { return !C.isLiab(a) && (a.space || 'personal') === 'personal'; }, f.from) + '</select>') +
      App.fld(T('Куда (накопления)', 'To (savings)'), '<select class="in" data-ch="fset" data-k="to">' + App.accOpts(function (a) { return !C.isLiab(a) && (a.space || 'personal') === 'personal'; }, f.to, '—') + '</select>') +
      App.fld(T('Сумма', 'Amount'), '<input class="in num" inputmode="decimal" data-ch="fset" data-k="amount" value="' + esc(f.amount) + '">') + '</div></div>' +
      '<div class="dashed-note">' + T('Создастся запись «Пополнение накоплений» — перевод между твоими счетами (не расход). Сделай такой же перевод в банке, если накопления на отдельном счёте. Повторно за этот месяц перевод не создаётся.', 'Creates a “Savings top-up” record — a transfer between your accounts (not spending). Make the same transfer in your bank if savings sit in a separate account. Only one per month.') + '</div>' + (m.err ? '<div class="alert danger">' + esc(m.err) + '</div>' : '');
    return { title: T('Остаток → накопления', 'Remainder → savings'), html: h, done: 'sweepOk', doneLabel: T('Перевести', 'Transfer') };
  };
  App.actions.fset = function (el) { S.modal.f[el.dataset.k] = el.value; };
  App.actions.sweepOk = function () {
    var m = S.modal, f = m.f, amt = App.toMinor(f.amount);
    if (!f.from || !f.to || f.from === f.to) { m.err = T('Выбери два разных счёта', 'Pick two different accounts'); App.renderModal(); return; }
    if (!(amt > 0)) { m.err = T('Неверная сумма', 'Invalid amount'); App.renderModal(); return; }
    var r = App.commit(T('Остаток бюджета переведён в накопления', 'Budget remainder moved to savings'), function (L) { return C.sweepBudget(L, m.ym, f.from, f.to, S.today, amt); });
    if (r && r.ok === false) { m.err = (r.errors || []).join(', '); App.renderModal(); return; }
    App.closeModal();
  };

  /* ---------- goal templates & stages ---------- */
  App.modals.goalTpl = function () {
    var h = '<div class="tpl-grid">' + C.GOAL_TEMPLATES.map(function (t) { return '<button class="tpl" data-a="goalTplPick" data-id="' + t.id + '"><span class="cat-ic" style="background:' + t.color + '">' + I(t.icon) + '</span><b>' + esc(T(t.ru, t.en)) + '</b><span class="tiny muted">' + esc(T(t.hint.ru, t.hint.en)) + '</span></button>'; }).join('') +
      '<button class="tpl" data-a="goalTplPick" data-id=""><span class="cat-ic" style="background:#8E8E93">' + I('target') + '</span><b>' + T('Своя цель', 'Custom goal') + '</b><span class="tiny muted">' + T('С нуля', 'From scratch') + '</span></button></div>';
    h += '<div class="dashed-note">' + T('Суммы в шаблонах — стартовые ориентиры, поменяй под себя. Этапы цели: Старт → Первые шаги → Набираю обороты → Больше половины → Финишная прямая → Цель достигнута.', 'Template amounts are starting points — adjust. Stages: Start → First steps → Building momentum → Past halfway → Final stretch → Achieved.') + '</div>';
    return { title: T('Шаблон цели', 'Goal template'), html: h };
  };
  App.actions.goalTplPick = function (el) {
    var t = C.GOAL_TEMPLATES.filter(function (x) { return x.id === el.dataset.id; })[0];
    App.openModal('goal', {}); var f = S.modal.f; App.modals.goal(S.modal);
    if (t) { var tgt = t.type === 'short_debt' ? C.debtSummary(C.spaceView(S.L, 'personal'), S.today).short : t.target; Object.assign(f, { title: T(t.ru, t.en), target: App.amtStr(tgt), type: t.type, tplColor: t.color, tplIcon: t.icon, note: T(t.hint.ru, t.hint.en) }); }
    App.renderModal();
  };
  App.actions.saveGoal = function () {
    var m = S.modal, f = m.f, t = App.toMinor(f.target); if (!f.title || !t) { m.err = 'x'; App.toast(T('Укажи название и сумму', 'Enter a title and amount')); return; }
    App.commit(T('Цель сохранена', 'Goal saved'), function (L) {
      var o = { title: f.title, target: t, currency: f.currency, targetDate: f.targetDate || null, note: f.note, accountId: f.accountId || null };
      if (m.id) Object.assign(C.byId(L.goals, m.id), o);
      else L.goals.push(Object.assign({ id: C.uid('goal'), type: f.type && f.type !== 'apartment' ? f.type : 'custom', contributions: [], color: f.tplColor || '#64D2FF', icon: f.tplIcon || 'target', space: App.space() }, o));
    });
    App.closeModal();
  };

  /* ---------- yearly income plan: month / quarter / year, manual actuals, variance ---------- */
  App.screens.incomeYear = function () {
    var L = S.L; S.ui.incY = S.ui.incY || +S.today.slice(0, 4); S.ui.incMode = S.ui.incMode || 'month';
    var y = S.ui.incY, mode = S.ui.incMode, rows = C.incomePlanView(L, y, mode), ip = L.incomePlan || { lines: [] };
    var h = '<div class="split"><button class="iconbtn" data-a="incYear" data-d="-1">' + I('back') + '</button><b>' + y + '</b><button class="iconbtn" data-a="incYear" data-d="1" style="transform:scaleX(-1)">' + I('back') + '</button></div>';
    h += '<div class="seg mt8">' + [['month', T('Месяцы', 'Months')], ['quarter', T('Кварталы', 'Quarters')], ['year', T('Год', 'Year')]].map(function (x) { return '<button class="' + (mode === x[0] ? 'on' : '') + '" data-a="incMode" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';

    }).join('') + '</div>';
    h += '<div class="sec-h"><span class="t small">' + T('Строки дохода', 'Income lines') + '</span><button class="more" data-a="modal" data-m="incLine">' + I('plus', 'sm') + T('Строка', 'Line') + '</button></div><div class="list">' + (ip.lines.length ? ip.lines.map(function (l) { return '<button class="row tap" data-a="modal" data-m="incLine" data-id="' + l.id + '"><span class="cat-ic" style="background:' + (l.type === 'salary' ? 'var(--income)' : l.type === 'debt_return' ? '#66D4CF' : '#8E8E93') + '">' + I(l.type === 'debt_return' ? 'undo' : 'wallet') + '</span><div class="main-t"><div class="t1">' + esc(l.title) + '</div><div class="t2">' + esc({ salary: T('зарплата', 'salary'), debt_return: T('возврат долга мне — не доход', 'loan returned — not income'), other: T('прочее', 'other') }[l.type] || l.type) + '</div></div>' + I('chev', 'sm') + '</button>'; }).join('') : '<div class="empty">' + T('Добавь строку дохода: зарплата, подработка, возврат долга.', 'Add an income line: salary, side income, loan returned.') + '</div>') + '</div>';
    h += '<div class="dashed-note">' + T('План — по месяцу поступления денег. Факт вводишь сам в конце месяца (нажми на месяц). «Записано в учёте» — сумма доходов и возвратов из записей за месяц, для сверки. Отклонение = факт − план.', 'Plan is by month of receipt. Enter actuals yourself at month end (tap a month). “Recorded” = income and returns from records that month, for reconciliation. Variance = actual − plan.') + '</div>';
    return { title: T('План доходов на год', 'Yearly income plan'), html: h };
  };
  App.actions.incYear = function (el) { S.ui.incY += +el.dataset.d; App.render(); };
  App.actions.incMode = function (el) { S.ui.incMode = el.dataset.v; App.render(); };
  App.modals.incActual = function (m) {
    var L = S.L, ym = m.ym, d = C.incomeMonth(L, ym), f = m.f;

    return { title: l ? T('Строка дохода', 'Income line') : T('Новая строка дохода', 'New income line'), html: h, done: 'incLineOk', doneLabel: T('Сохранить', 'Save') };
  };
  App.actions.incLineOk = function () {
    var m = S.modal, f = m.f; if (!f.title) { App.toast(T('Укажи название', 'Enter a title')); return; }
    App.commit(T('Строка дохода сохранена', 'Income line saved'), function (L) {
      var ip = C.ensureIncomePlan(L);
      if (m.id) { var l = C.byId(ip.lines, m.id); l.title = f.title; l.type = f.type; return; }
      var id = C.uid('inc'), e = App.toMinor(f.exp || '0') || 0, lo = f.low ? App.toMinor(f.low) : e;

      App.commit(T('Строка удалена', 'Line deleted'), function (L) { var ip = C.ensureIncomePlan(L); ip.lines = ip.lines.filter(function (l) { return l.id !== id; }); ['months', 'actuals'].forEach(function (k) { Object.keys(ip[k]).forEach(function (ym) { delete ip[k][ym][id]; if (!Object.keys(ip[k][ym]).length) delete ip[k][ym]; }); }); });
    }, true, T('Удалить', 'Delete'));
  };

  function incYearCard() {
    var y = +S.today.slice(0, 4), ym = C.ymOf(S.today), cur = C.incomeMonth(S.L, ym), tot = C.incomePlanView(S.L, y, 'year')[0];
    return '<div class="card tap" data-a="go" data-s="incomeYear"><div class="card-h"><span class="t">' + T('План доходов на год', 'Yearly income plan') + '</span><span class="more">' + I('chev', 'sm') + '</span></div><div class="kpis">' + App.kpi(App.fym(ym), F(cur.exp), 'plan', cur.actual == null ? T('факт не введён', 'no actual yet') : T('факт ', 'actual ') + F(cur.actual)) + App.kpi(String(y), F(tot.exp), 'pos', tot.variance == null ? T('месяц · квартал · год', 'month · quarter · year') : T('отклонение ', 'variance ') + App.FS(tot.variance)) + '</div></div>';

  var incScreen = App.screens.income;
  App.screens.income = function (p) { var out = incScreen(p); out.html = incYearCard() + out.html; return out; };

  /* ---------- rates: AED per USD, UZS per AED (inverse input), date caption ---------- */
  App.screens.currencies = function () {
    var L = S.L, d = L.rateDates || {};
    var row = function (c) {
      if (c === 'AED') return App.fld('AED' + T(' (базовая)', ' (base)'), '<span class="muted">1</span>');

    h += '<div class="dashed-note">' + T('Курсы вводятся вручную и не загружаются из интернета. Дата обновления ставится автоматически при изменении. UZS вводится как «сколько сумов за 1 AED». На главной под общим балансом показаны пересчёты в USD и UZS.', 'Rates are manual, never downloaded. The update date is set when you change a rate. UZS is entered as “UZS per 1 AED”. The dashboard shows USD and UZS equivalents.') + '</div>';
    return { title: T('Валюты и курсы', 'Currencies & rates'), html: h };

  App.actions.rateSet = function (el) { var v = parseFloat(String(el.value).replace(',', '.').replace(/\s/g, '')); if (!(v > 0)) { App.toast(T('Неверный курс', 'Invalid rate')); App.render(); return; } App.commit(T('Курс ', 'Rate ') + el.dataset.c + ' = ' + v, function (L) { L.rates[el.dataset.c] = v; L.rateDates = L.rateDates || {}; L.rateDates[el.dataset.c] = S.today; }); };

  /* ---------- statistics: monthly / quarterly expense summary ---------- */
  function summaryHtml(kind, ym) {

    return { label: r.label, html: h };

  var statsHub = App.screens.stats;

    var out = statsHub(), ym = C.ymOf(S.today), mo = summaryHtml('month', ym), q = summaryHtml('quarter', ym);

  var statDetail = App.screens.stat;
  App.screens.stat = function (p) {
    if (p.k !== 'summary') return statDetail(p);
    S.ui.sumKind = S.ui.sumKind || 'month'; S.ui.sumYm = S.ui.sumYm || C.ymOf(S.today);
    var kind = S.ui.sumKind, ym = S.ui.sumYm, step = kind === 'quarter' ? 3 : 1, s = summaryHtml(kind, ym);
    var h = '<div class="seg">' + [['month', T('Месяц', 'Month')], ['quarter', T('Квартал', 'Quarter')]].map(function (x) { return '<button class="' + (kind === x[0] ? 'on' : '') + '" data-a="sumKind" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
    h += '<div class="split mt12"><button class="iconbtn" data-a="sumShift" data-d="' + (-step) + '">' + I('back') + '</button><b>' + esc(s.label) + '</b><button class="iconbtn" data-a="sumShift" data-d="' + step + '" style="transform:scaleX(-1)">' + I('back') + '</button></div>';

    h += '<div class="dashed-note">' + T('Сводка строится по фактическим записям. Погашение тела долга и переводы семье показаны отдельно от расходов на жизнь; полученные займы не считаются доходом.', 'Built from actual records. Debt principal and family transfers are shown apart from living costs; loans received are not income.') + '</div>';
    return { title: T('Сводка расходов', 'Expense summary'), html: h };
  };
  App.actions.sumKind = function (el) { S.ui.sumKind = el.dataset.v; App.render(); };
  App.actions.sumShift = function (el) { S.ui.sumYm = C.addMonths(S.ui.sumYm, +el.dataset.d); App.render(); };
})();

<script>
/* Akbar Finance — Академия: годовая программа (52 недели). Контент уроков лежит в отдельных файлах week-NN.js
   и подключается по одной неделе. Неделя без файла показывается на карте как «скоро». */
(function (g) {
  'use strict';
  var LEVELS = [
    { n: 1, title: 'Основа', en: 'Foundations', color: '#30D158', weeks: [1, 8], about: 'Учёт, бюджет, денежный поток, личный финансовый отчёт, привычки.' },
    { n: 2, title: 'Долги', en: 'Debt', color: '#FF453A', weeks: [9, 18], about: 'Реальная стоимость денег, APR, лавина и снежный ком, снятие наличных, переговоры с кредитором.' },
